<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SSVP - Barra de Desenvolvimento</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-toolbar: rgba(13, 21, 39, 0.95);
      --border-toolbar: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --toolbar-height: 60px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body, html {
      background-color: #090d16;
      color: var(--text-main);
      height: 100vh;
      height: 100dvh; /* Viewport dinâmico móvel */
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra Superior Fixa (Dev Toolbar) */
    .dev-toolbar {
      height: var(--toolbar-height);
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border-toolbar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top) 12px 0 12px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99999;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Estado Oculto da Barra */
    .dev-toolbar.collapsed {
      transform: translateY(-100%);
    }

    /* Gatilho Flutuante (Handle) para Reexibir */
    .dev-toolbar-handle {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      z-index: 99998;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background-color 0.2s ease;
    }

    .dev-toolbar-handle::after {
      content: '';
      width: 40px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      margin-top: 3px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .dev-toolbar.collapsed + .dev-toolbar-handle::after {
      opacity: 1;
    }

    .dev-toolbar.collapsed + .dev-toolbar-handle:hover::after {
      background-color: var(--primary);
    }

    .dev-toolbar.collapsed + .dev-toolbar-handle {
      background-color: rgba(9, 13, 22, 0.5);
      backdrop-filter: blur(2px);
      height: 16px;
    }

    /* Elementos de Ação */
    .dev-toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }

    .dev-toolbar-actions::-webkit-scrollbar {
      display: none;
    }

    /* Seletor de Testes Dropdown */
    .dev-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      max-width: 140px;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dev-select option {
      background-color: #0d1527;
      color: var(--text-main);
    }

    /* Botões da Toolbar */
    .btn-dev {
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-dev:hover {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-dev.active-sim {
      border-color: var(--primary);
      box-shadow: 0 0 5px rgba(59, 130, 246, 0.3);
    }

    .btn-dev.hide-btn {
      margin-left: auto;
      background-color: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .btn-dev.hide-btn:hover {
      background-color: var(--error);
      color: white;
    }

    /* Visualizador Central (Iframe) */
    .iframe-container {
      width: 100vw;
      height: calc(100vh - var(--toolbar-height));
      height: calc(100dvh - var(--toolbar-height)); /* Viewport dinâmico móvel */
      margin-top: var(--toolbar-height);
      background-color: #0b0f19;
      position: relative;
      transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1), margin-top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dev-toolbar.collapsed ~ .iframe-container {
      height: 100vh;
      height: 100dvh; /* Viewport dinâmico móvel */
      margin-top: 0;
    }

    .iframe-display {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #000;
    }

    /* Gaveta de Logs (Drawer) */
    .log-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 180px;
      background-color: rgba(10, 15, 26, 0.96);
      border-top: 1px solid var(--border-toolbar);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .log-drawer.open {
      transform: translateY(0);
    }

    .log-header {
      padding: 8px 12px;
      background-color: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .log-content {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.72rem;
      color: #a7f3d0;
      white-space: pre-wrap;
      background-color: rgba(0, 0, 0, 0.2);
    }

    .btn-log-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .btn-log-close:hover {
      color: var(--text-main);
    }

    .placeholder-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Barra Superior de Ferramentas -->
  <div id="dev-toolbar" class="dev-toolbar">
    <div class="dev-toolbar-actions">
      <!-- Seletor Dinâmico de Testes -->
      <select id="test-selector" class="dev-select" onchange="loadSelectedTest()">
        <option value="">🧪 Selecionar...</option>
      </select>

      <!-- Botão Cíclico de Simulação de Conexão -->
      <button id="btn-conn" class="btn-dev" onclick="cycleNetworkSimulation()">
        📶 Rede Real
      </button>

      <!-- Botão de Medir Performance -->
      <button id="btn-perf" class="btn-dev" onclick="measurePerformance()">
        ⚡ Perf: N/A
      </button>

      <!-- Botão de Exibição de Logs -->
      <button id="btn-logs" class="btn-dev" onclick="toggleLogs()">
        📋 Logs
      </button>

      <!-- Botão Ocultar Barra (Seta) -->
      <button class="btn-dev hide-btn" onclick="collapseToolbar()" title="Ocultar Painel (Swipe Up)">
        ▲ Recolher
      </button>
    </div>
  </div>

  <!-- Gatilho de Reexibição de Toque/Deslize -->
  <div id="toolbar-handle" class="dev-toolbar-handle"></div>

  <!-- Área de Exibição do Teste -->
  <div class="iframe-container">
    <div id="iframe-placeholder" class="placeholder-message">
      <p style="font-weight: 600; margin-bottom: 5px;">Visualizador de Testes SSVP</p>
      <p style="font-size: 0.75rem; opacity: 0.7;">Selecione um teste na barra superior para começar.</p>
    </div>
    <iframe id="test-viewer" class="iframe-display" style="display: none;"></iframe>
  </div>

  <!-- Gaveta de Logs -->
  <div id="log-drawer" class="log-drawer">
    <div class="log-header">
      <span>Console do Desenvolvedor</span>
      <button class="btn-log-close" onclick="toggleLogs()">✕ Fechar</button>
    </div>
    <div id="log-content" class="log-content">Aguardando execução de testes...</div>
  </div>

  <script>
    const user = 'ssvpweb';
    const repo = 'ssvpweb.github.io';
    const baseFolder = 'testes';

    // Banco de Dados Local Estático de Redundância (fallback completo para offline)
    const fallbackTestes = [
      { folder: "google_login", files: [{ name: "v1_google_login_autenticacao.html" }] },
      {
        folder: "google_maps",
        files: [
          { name: "v1_lista_botoes.html" },
          { name: "v2_mapa_local.html" },
          { name: "v3_mapa_leaflet_geral.html" },
          { name: "v4_dropdown_selecao_enderecos.html" },
          { name: "v4.1_voz_comandos_mapa.html" },
          { name: "v4.2_voz_feedback_mapa.html" },
          { name: "v5_simulador_visita_basico.html" },
          { name: "v5.1_simulador_visita_voz_referencias.html" }
        ]
      },
      { folder: "google_sheets", files: [{ name: "LEIA_ME.html" }, { name: "v1_sheets_crud_pessoas.html" }] },
      { folder: "login", files: [{ name: "v1_pin.html" }, { name: "v2_senha.html" }] },
      { folder: "open_street_maps", files: [{ name: "v1_osm_busca_raio.html" }] },
      { folder: "pastoral_de_rua", files: [{ name: "relato.html" }] },
      { folder: "pwa", files: [{ name: "index.html" }] },
      { folder: "sem_internet", files: [{ name: "LEIA_ME.html" }] },
      { folder: "simuladores", files: [{ name: "v1_sincronizador_visitas_local_nuvem.html" }, { name: "v2_sincronizador_visitas_local_nuvem.html" }] },
      { folder: "sincronizacao", files: [{ name: "v1_sinc_fila_offline.html" }] },
      { folder: "spa", files: [{ name: "index.html" }, { name: "v1_login_spa.html" }] },
      { folder: "ux", files: [{ name: "index.html" }, { name: "login.html" }] },
      { folder: "ux/barra_inferior", files: [{ name: "index.html" }] },
      { folder: "ux/cards_expand", files: [{ name: "index.html" }] },
      { folder: "ux/cards_slide", files: [{ name: "index.html" }] },
      { folder: "ux/voz_com_toque", files: [{ name: "index.html" }] },
      { folder: "ux/app", files: [{ name: "v1_layout_basico.html" }] },
      { folder: "voz", files: [{ name: "LEIA_ME.html" }, { name: "v1_gravacao_audio_simples.html" }, { name: "v2_comandos_de_voz.html" }] }
    ];

    const toolbar = document.getElementById('dev-toolbar');
    const handle = document.getElementById('toolbar-handle');
    const iframe = document.getElementById('test-viewer');
    const placeholder = document.getElementById('iframe-placeholder');
    const testSelector = document.getElementById('test-selector');
    const btnConn = document.getElementById('btn-conn');
    const btnPerf = document.getElementById('btn-perf');
    const logDrawer = document.getElementById('log-drawer');
    const logContent = document.getElementById('log-content');

    // Estados Globais
    let allTestFiles = [];
    let simulatedState = null; // null (Real), 'wifi', '5g', 'offline'
    let perfStartTime = 0;

    // --- 1. Inicialização e Carregamento de Testes ---
    async function loadTestMenu() {
      try {
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/main?recursive=true`);
        if (!response.ok) throw new Error('API Offline ou Limitada');

        const data = await response.json();
        const testsPrefix = `${baseFolder}/`;
        
        // Filtra arquivos html nas subpastas
        const filtered = data.tree.filter(item => {
          return item.type === 'blob' &&
                 item.path.startsWith(testsPrefix) &&
                 item.path.endsWith('.html') &&
                 !(item.path === `${testsPrefix}index.html`) &&
                 item.path.substring(testsPrefix.length).includes('/');
        });

        // Agrupa por diretório
        const groups = {};
        filtered.forEach(file => {
          const relativePath = file.path.substring(testsPrefix.length);
          const parts = relativePath.split('/');
          const fileName = parts.pop();
          const folderName = parts.join(' / ');

          if (!groups[folderName]) groups[folderName] = [];
          groups[folderName].push({
            name: fileName,
            path: `./${baseFolder}/${relativePath}`
          });
        });

        renderSelector(groups);
      } catch (error) {
        console.warn("Utilizando Fallback Local Estático para o menu.");
        logAction("Aviso: Menu dev carregado em modo fallback local.");
        
        const groups = {};
        fallbackTestes.forEach(item => {
          const folderName = item.folder;
          const folderPath = folderName.replace(/ \/ /g, '/');
          
          groups[folderName] = item.files.map(f => {
            return {
              name: f.name,
              path: `./${baseFolder}/${folderPath}/${f.name}`
            };
          });
        });

        renderSelector(groups);
      }
    }

    function renderSelector(groups) {
      // Limpa e preserva placeholder
      testSelector.innerHTML = '<option value="">🧪 Selecionar...</option>';
      
      const sortedKeys = Object.keys(groups).sort();
      sortedKeys.forEach(folder => {
        const optgroup = document.createElement('optgroup');
        optgroup.label = folder;

        groups[folder].sort((a,b) => a.name.localeCompare(b.name)).forEach(file => {
          const opt = document.createElement('option');
          opt.value = file.path;
          opt.textContent = file.name;
          optgroup.appendChild(opt);
        });

        testSelector.appendChild(optgroup);
      });
    }

    // Carrega o teste selecionado no iframe
    function loadSelectedTest() {
      const selectedPath = testSelector.value;
      if (!selectedPath) {
        iframe.style.display = 'none';
        placeholder.style.display = 'block';
        btnPerf.textContent = '⚡ Perf: N/A';
        return;
      }

      placeholder.style.display = 'none';
      iframe.style.display = 'block';
      
      logAction(`Carregando teste: ${selectedPath}`);
      perfStartTime = performance.now();
      iframe.src = selectedPath;
    }

    // --- 2. Simulação de Conexão Cíclica (Mocking) ---
    function cycleNetworkSimulation() {
      if (simulatedState === null) {
        simulateNetwork('wifi');
      } else if (simulatedState === 'wifi') {
        simulateNetwork('5g');
      } else if (simulatedState === '5g') {
        simulateNetwork('offline');
      } else {
        simulateNetwork(null); // Volta para o real
      }
    }

    function simulateNetwork(state) {
      const wasOnline = simulatedState !== 'offline';
      simulatedState = state;
      
      // Atualiza visual do botão
      if (state === 'wifi') {
        btnConn.textContent = '📶 WIFI';
        btnConn.style.color = 'var(--success)';
        btnConn.style.borderColor = 'var(--success)';
        btnConn.classList.add('active-sim');
        logAction('Simulador Rede: Definido como WIFI (Banda Larga)');
      } else if (state === '5g') {
        btnConn.textContent = '📶 5G';
        btnConn.style.color = 'var(--warning)';
        btnConn.style.borderColor = 'var(--warning)';
        btnConn.classList.add('active-sim');
        logAction('Simulador Rede: Definido como 5G (Rede Móvel)');
      } else if (state === 'offline') {
        btnConn.textContent = '📶 Offline';
        btnConn.style.color = 'var(--error)';
        btnConn.style.borderColor = 'var(--error)';
        btnConn.classList.add('active-sim');
        logAction('Simulador Rede: Definido como OFFLINE (Sem Sinal)');
      } else {
        btnConn.textContent = '📶 Rede Real';
        btnConn.style.color = 'var(--text-main)';
        btnConn.style.borderColor = 'rgba(255,255,255,0.08)';
        btnConn.classList.remove('active-sim');
        logAction('Simulador Rede: Restaurado para a rede real do navegador.');
      }

      // Injeta e atualiza o mock no Iframe
      applyMockAndTriggerEvent(wasOnline);
    }

    function applyMockAndTriggerEvent(wasOnline) {
      try {
        const iframeWin = iframe.contentWindow;
        if (!iframeWin) return;

        // Mock do getter navigator.onLine no iframe
        Object.defineProperty(iframeWin.navigator, 'onLine', {
          get: () => {
            if (simulatedState === 'offline') return false;
            return true;
          },
          configurable: true
        });

        // Dispara evento online/offline se o status mudou
        const isOnline = simulatedState !== 'offline';
        if (wasOnline !== isOnline) {
          const eventName = isOnline ? 'online' : 'offline';
          iframeWin.dispatchEvent(new Event(eventName));
          logAction(`[Iframe Event] Disparado evento '${eventName}'`);
        }
      } catch (e) {
        // Ignora erros de mesma origem (só ocorrem se tentar carregar algo de outro domínio)
      }
    }

    // Garante que o Mock seja injetado toda vez que o iframe sofrer reload
    iframe.onload = () => {
      applyMockAndTriggerEvent(simulatedState !== 'offline');
      
      // Mede velocidade de carregamento final do teste
      if (perfStartTime > 0) {
        const delta = Math.round(performance.now() - perfStartTime);
        btnPerf.textContent = `⚡ ${delta}ms`;
        if (delta < 300) {
          btnPerf.style.color = 'var(--success)';
        } else if (delta < 1000) {
          btnPerf.style.color = 'var(--warning)';
        } else {
          btnPerf.style.color = 'var(--error)';
        }
        logAction(`Velocidade de carregamento do teste: ${delta}ms`);
        perfStartTime = 0;
      }

      // Redireciona console.log do Iframe para os logs da nossa toolbar
      interceptIframeConsole();
    };

    function interceptIframeConsole() {
      try {
        const iframeWin = iframe.contentWindow;
        if (!iframeWin) return;

        const originalLog = iframeWin.console.log;
        iframeWin.console.log = (...args) => {
          originalLog.apply(iframeWin.console, args);
          logAction(`[Test Log] ${args.join(' ')}`);
        };

        const originalError = iframeWin.console.error;
        iframeWin.console.error = (...args) => {
          originalError.apply(iframeWin.console, args);
          logAction(`[Test Error] ❌ ${args.join(' ')}`);
        };
      } catch(e) {
        // Erro cross-origin se abrir arquivo inválido
      }
    }

    // --- 3. Medição Manual de Performance ---
    function measurePerformance() {
      if (!testSelector.value) {
        logAction("Selecione um teste primeiro para medir a performance.");
        return;
      }
      logAction("Medindo performance do teste (Recarregando iframe)...");
      perfStartTime = performance.now();
      iframe.src = iframe.src;
    }

    // --- 4. Logs Drawer ---
    function toggleLogs() {
      logDrawer.classList.toggle('open');
    }

    function logAction(msg) {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const text = `[${timeStr}] ${msg}\n`;
      
      if (logContent.textContent === 'Aguardando execução de testes...') {
        logContent.textContent = text;
      } else {
        logContent.textContent += text;
      }
      logContent.scrollTop = logContent.scrollHeight;
    }

    function clearLogs() {
      logContent.textContent = 'Logs limpos.\n';
    }

    // --- 5. Controle de Recolhimento da Barra (Gestos & Touch) ---
    function collapseToolbar() {
      toolbar.classList.add('collapsed');
      logAction("Barra de ferramentas recolhida. Toque no topo ou deslize para baixo para exibir.");
    }

    function expandToolbar() {
      toolbar.classList.remove('collapsed');
    }

    // Gestos de toque (Swipe) na barra para recolher
    let startY = 0;
    toolbar.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    }, { passive: true });

    toolbar.addEventListener('touchmove', (e) => {
      const currentY = e.touches[0].clientY;
      if (startY - currentY > 20) { // Deslizar para cima
        collapseToolbar();
      }
    }, { passive: true });

    // Gestos de toque (Swipe ou clique) no gatilho flutuante para expandir
    handle.addEventListener('click', expandToolbar);

    handle.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
    }, { passive: true });

    handle.addEventListener('touchmove', (e) => {
      const currentY = e.touches[0].clientY;
      if (currentY - startY > 10) { // Deslizar para baixo
        expandToolbar();
      }
    }, { passive: true });

    // Inicialização
    loadTestMenu();
  </script>
</body>
</html>
