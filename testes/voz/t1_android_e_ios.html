<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Teste Voz Android e iOS</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-strong: #1f2937;
      --line: rgba(255,255,255,0.08);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-strong: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
    }

    .app {
      width: min(100%, 480px);
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.25);
      padding: 22px 18px 18px;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 18px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
    }

    .icon {
      width: 28px;
      height: 28px;
      display: block;
      filter: brightness(0) invert(1);
      flex-shrink: 0;
    }

    .mic-icon {
      width: 52px;
      height: 52px;
      display: block;
      filter: brightness(0) invert(1);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(1.4rem, 3vw, 2rem);
      text-align: center;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .mic-button {
      width: 120px;
      height: 120px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      display: grid;
      place-items: center;
      box-shadow: 0 16px 28px rgba(37, 99, 235, 0.45);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .mic-button:active {
      transform: scale(0.97);
      filter: brightness(1.08);
    }

    .mic-button.listening {
      background: linear-gradient(135deg, var(--warning), #f97316);
      box-shadow: 0 16px 28px rgba(245, 158, 11, 0.4);
    }

    .result-box {
      width: 100%;
      min-height: 120px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px 16px;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.4;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .status {
      min-height: 22px;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
    }

    .status.error {
      color: #fca5a5;
    }

    .status.success {
      color: #86efac;
    }

    @media (max-width: 380px) {
      .mic-button {
        width: 110px;
        height: 110px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <a class="back-button" href="./index.html">
        <img class="icon" src="../../img/chevron_left.svg" alt="Voltar" aria-hidden="true">
        <span>Voltar</span>
      </a>
    </div>

    <h1>Microfone e voz</h1>

    <div class="panel">
      <button id="micButton" class="mic-button" aria-label="Ativar microfone" type="button">
        <img class="mic-icon" src="../../img/mic.svg" alt="Microfone" aria-hidden="true">
      </button>

      <div id="resultBox" class="result-box" aria-live="polite" tabindex="0">
        Texto desconhecido
      </div>

      <div id="status" class="status">Toque no botão para falar.</div>
    </div>
  </div>

  <script>
    const resultBox = document.getElementById('resultBox');
    const micButton = document.getElementById('micButton');
    const status = document.getElementById('status');

    let recognition = null;
    let isListening = false;

    function setStatus(message, type = '') {
      status.textContent = message;
      status.classList.remove('error', 'success');
      if (type) status.classList.add(type);
    }

    function speakText(text) {
      const finalText = (text || 'Texto desconhecido').trim();
      if (!finalText) return;

      if (!('speechSynthesis' in window)) {
        setStatus('Seu navegador não suporta leitura de voz.', 'error');
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(finalText);
      utterance.lang = 'pt-BR';
      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function startRecognition() {
      const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognitionCtor) {
        setStatus('Reconhecimento de fala não disponível neste navegador.', 'error');
        return;
      }

      if (recognition) {
        recognition.stop();
      }

      recognition = new SpeechRecognitionCtor();
      recognition.lang = 'pt-BR';
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        micButton.classList.add('listening');
        setStatus('Ouvindo... fale agora.', 'success');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript || 'Texto desconhecido';
        resultBox.textContent = transcript;
        setStatus('Texto capturado com sucesso.', 'success');
      };

      recognition.onerror = (event) => {
        isListening = false;
        micButton.classList.remove('listening');
        const message = event.error === 'not-allowed'
          ? 'Permita o microfone para continuar.'
          : 'Não foi possível capturar o áudio.';
        setStatus(message, 'error');
      };

      recognition.onend = () => {
        isListening = false;
        micButton.classList.remove('listening');
        const text = resultBox.textContent.trim();
        if (text && text !== 'Texto desconhecido') {
          setStatus('Clique na caixa para ouvir o texto.', 'success');
        } else {
          setStatus('Toque no botão para falar.', '');
        }
      };

      recognition.start();
    }

    micButton.addEventListener('click', () => {
      if (isListening) {
        recognition.stop();
        return;
      }
      startRecognition();
    });

    resultBox.addEventListener('click', () => {
      speakText(resultBox.textContent);
    });

    resultBox.addEventListener('touchstart', () => {
      speakText(resultBox.textContent);
    }, { passive: true });
  </script>
</body>
</html>
