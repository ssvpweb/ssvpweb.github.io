<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Protótipo: Reconhecimento de Voz (Web Speech API) - v1.0</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #0f172a;
            --accent-primary: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --font-main: 'Outfit', sans-serif;
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            padding-top: calc(var(--safe-area-inset-top) + 2.5rem);
            padding-bottom: calc(var(--safe-area-inset-bottom) + 1.8rem);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Barra de Versão Superior Obrigatória */
        .version-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .version-tag {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 0.125rem 0.5rem;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Card Central do Controle */
        .control-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Efeito de brilho de fundo quando ativo */
        .control-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            z-index: 1;
            transition: opacity 0.5s ease;
            pointer-events: none;
            opacity: 0;
        }

        .control-card.active::before {
            opacity: 1;
            animation: pulse-bg 3s infinite ease-in-out;
        }

        /* Botão Circular de Microfone */
        .mic-btn-container {
            position: relative;
            z-index: 2;
        }

        .btn-mic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
            transition: transform 0.2s, box-shadow 0.3s, background 0.3s;
        }

        .btn-mic svg {
            width: 38px;
            height: 38px;
            fill: currentColor;
            transition: transform 0.2s;
        }

        .btn-mic:hover {
            transform: scale(1.04);
            box-shadow: 0 10px 28px rgba(139, 92, 246, 0.5);
        }

        .btn-mic:active {
            transform: scale(0.96);
        }

        /* Estado Gravando (Pulsante) */
        .btn-mic.recording {
            background: linear-gradient(135deg, var(--accent-danger), #f43f5e);
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 1.5s infinite;
        }

        .btn-mic.recording svg {
            animation: scale-svg 1.5s infinite ease-in-out;
        }

        /* Status Text */
        .status-badge {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 2;
            transition: all 0.3s;
        }

        .status-badge.listening {
            border-color: rgba(239, 68, 68, 0.4);
            color: #fda4af;
            background-color: rgba(239, 68, 68, 0.05);
        }

        /* Área de Transcrição e Resultados */
        .transcription-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            z-index: 2;
        }

        /* Prevenção de Zoom no iPhone e Acessibilidade */
        .textarea-output {
            width: 100%;
            height: 160px;
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1rem;
            color: var(--text-main);
            font-family: var(--font-main);
            font-size: 1.1rem; /* Mínimo 16px para iOS */
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        .textarea-output:focus {
            border-color: var(--accent-primary);
        }

        /* Botões secundários */
        .actions-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            padding: 0.75rem;
            font-family: var(--font-main);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #475569;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-success {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.2);
            color: var(--accent-success);
        }

        .btn-success:hover {
            background-color: var(--accent-success);
            color: var(--text-main);
        }

        /* Console de Logs Mobile no Rodapé */
        .logs-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .logs-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-clear-logs {
            background: none;
            border: none;
            color: var(--accent-danger);
            font-size: 0.75rem;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 500;
        }

        .logs-box {
            background-color: #020617;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 12px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 120px;
            height: 120px;
            overflow-y: auto;
            color: #38bdf8;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Animações CSS */
        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        @keyframes pulse-bg {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
        }

        @keyframes scale-svg {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(0.9);
            }
        }
    </style>
</head>
<body>

    <!-- Barra de Versão Superior Obrigatória -->
    <div class="version-bar">
        <span>testes/voz/v1_reconhecimento.html</span>
        <span class="version-tag">Versão 1.0 (Estável)</span>
    </div>

    <div class="container">
        <header>
            <h1>Reconhecimento de Voz</h1>
            <p>Validação da Web Speech API para campo offline</p>
        </header>

        <!-- CARD 1: Controle de Captação -->
        <div class="control-card" id="controlCard">
            
            <div class="status-badge" id="statusBadge">Pronto para iniciar</div>

            <!-- Botão de Microfone -->
            <div class="mic-btn-container">
                <button class="btn-mic" id="btnMic" title="Clique para falar">
                    <!-- Ícone de Microfone SVG -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </button>
            </div>

            <!-- Texto de Transcrição -->
            <div class="transcription-area">
                <label for="txtTranscricao" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">
                    Resultado da Transcrição:
                </label>
                <textarea id="txtTranscricao" class="textarea-output" placeholder="O texto reconhecido aparecerá aqui em tempo real conforme você fala..." readonly></textarea>
            </div>

            <!-- Ações Rápidas -->
            <div class="actions-bar">
                <button class="btn" id="btnCopy">Copiar Texto</button>
                <button class="btn btn-success" id="btnClean">Limpar</button>
            </div>

        </div>

        <!-- CARD 2: Console de Logs -->
        <div class="logs-card">
            <div class="logs-title">
                <span>Logs do Sistema (Mobile Debug)</span>
                <button class="btn-clear-logs" id="btnClearLogs">Limpar Logs</button>
            </div>
            <div class="logs-box" id="logsBox">
                <!-- Javascript populará -->
            </div>
        </div>
    </div>

    <script>
        // Referências DOM
        const controlCard = document.getElementById('controlCard');
        const btnMic = document.getElementById('btnMic');
        const statusBadge = document.getElementById('statusBadge');
        const txtTranscricao = document.getElementById('txtTranscricao');
        const btnCopy = document.getElementById('btnCopy');
        const btnClean = document.getElementById('btnClean');
        const logsBox = document.getElementById('logsBox');
        const btnClearLogs = document.getElementById('btnClearLogs');

        let isRecording = false;

        // Log Helper
        function log(msg, type = '') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            if (type === 'success') div.style.color = '#10b981';
            else if (type === 'error') div.style.color = '#ef4444';
            else if (type === 'warn') div.style.color = '#f59e0b';
            else div.style.color = '#38bdf8';
            div.textContent = `[${time}] ${msg}`;
            logsBox.appendChild(div);
            logsBox.scrollTop = logsBox.scrollHeight;
        }

        // Unificação de APIs de Reconhecimento (Compatibilidade Chrome + Safari iOS)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            log("ERRO: Web Speech API não é suportada neste navegador.", "error");
            statusBadge.textContent = "Sem Suporte no Navegador";
            statusBadge.style.color = "var(--accent-danger)";
            btnMic.style.opacity = "0.5";
            btnMic.disabled = true;
        } else {
            log("API de voz carregada. Pronto para teste.");
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true; // Mantém ouvindo mesmo após pequenas pausas
            recognition.interimResults = true; // Retorna resultados parciais em tempo real

            // Ações do Microfone
            btnMic.addEventListener('click', () => {
                // Acesso de segurança: acionado por clique físico do usuário
                if (isRecording) {
                    log("Solicitando parada do reconhecimento de voz...");
                    recognition.stop();
                } else {
                    try {
                        txtTranscricao.value = '';
                        recognition.start();
                        log("Iniciando captação de voz...");
                    } catch (err) {
                        log("Erro ao iniciar: " + err.message, "error");
                    }
                }
            });

            // Eventos do Reconhecimento
            recognition.onstart = () => {
                isRecording = true;
                controlCard.classList.add('active');
                btnMic.classList.add('recording');
                statusBadge.classList.add('listening');
                statusBadge.textContent = "🎤 Ouvindo... Fale agora";
                log("Microfone ATIVO. Transcrevendo em tempo real...", "success");
            };

            recognition.onresult = (event) => {
                let textoFinal = '';
                let textoInterino = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        textoFinal += transcript;
                        log(`Frase Finalizada: "${transcript}"`, "success");
                    } else {
                        textoInterino += transcript;
                    }
                }

                // Exibe o texto consolidado + o que está sendo processado na hora
                txtTranscricao.value = textoFinal + (textoInterino ? ' ' + textoInterino : '');
            };

            recognition.onend = () => {
                isRecording = false;
                controlCard.classList.remove('active');
                btnMic.classList.remove('recording');
                statusBadge.classList.remove('listening');
                statusBadge.textContent = "Gravação Finalizada";
                log("Microfone DESATIVADO.", "warn");
            };

            recognition.onerror = (event) => {
                log(`ERRO DE VOZ: ${event.error}`, "error");
                
                if (event.error === 'not-allowed') {
                    alert('Permissão de microfone negada. Acesse as configurações do site no seu navegador e ative a permissão do microfone.');
                    statusBadge.textContent = "Permissão Negada";
                } else if (event.error === 'no-speech') {
                    statusBadge.textContent = "Nenhuma fala detectada";
                }
            };
        }

        // Copiar Texto para Área de Transferência
        btnCopy.addEventListener('click', () => {
            const texto = txtTranscricao.value.trim();
            if (!texto) {
                log("Nenhum texto para copiar.", "warn");
                return;
            }

            navigator.clipboard.writeText(texto).then(() => {
                log("Texto copiado para a área de transferência!", "success");
                const oldText = btnCopy.textContent;
                btnCopy.textContent = "✓ Copiado!";
                setTimeout(() => btnCopy.textContent = oldText, 2000);
            }).catch(err => {
                log("Erro ao copiar texto: " + err.message, "error");
            });
        });

        // Limpar Transcrição
        btnClean.addEventListener('click', () => {
            txtTranscricao.value = '';
            log("Caixa de transcrição limpa.");
        });

        // Limpar logs
        btnClearLogs.addEventListener('click', () => {
            logsBox.innerHTML = '';
            log("Console de logs limpo.");
        });
    </script>
</body>
</html>
