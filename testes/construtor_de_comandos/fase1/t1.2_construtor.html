<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reconhecimento de Voz Estável - SSVP</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: hsl(222, 47%, 7%);
      --card-bg: hsl(222, 40%, 12%);
      --primary-color: hsl(250, 95%, 70%);
      --primary-glow: hsla(250, 95%, 70%, 0.2);
      --accent-color: hsl(330, 90%, 60%);
      --accent-glow: hsla(330, 90%, 60%, 0.25);
      --text-main: hsl(210, 40%, 98%);
      --text-muted: hsl(215, 20%, 65%);
      --border-color: rgba(255, 255, 255, 0.06);
      
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      padding-bottom: calc(40px + var(--safe-bottom));
      justify-content: space-between;
    }

    /* Identificação da Versão no Topo (Regra do Workspace) */
    .top-version-bar {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.6;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, var(--primary-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    main {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-grow: 1;
      justify-content: center;
    }

    /* Card de Transcrição */
    .recognition-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: border-color 0.3s;
    }

    .recognition-card.active {
      border-color: var(--accent-color);
      box-shadow: 0 10px 30px var(--accent-glow);
    }

    .text-output {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 500;
      text-align: center;
      line-height: 1.5;
      color: var(--text-main);
      word-break: break-word;
    }

    .text-placeholder {
      font-size: 1rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Controles do Microfone */
    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .mic-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color) 0%, hsl(250, 95%, 60%) 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .mic-btn::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: var(--primary-color);
      opacity: 0.2;
      z-index: -1;
    }

    .mic-btn:active {
      transform: scale(0.92);
    }

    .mic-btn.preparing {
      background: linear-gradient(135deg, hsl(35, 95%, 55%) 0%, hsl(20, 95%, 50%) 100%);
      box-shadow: 0 8px 30px rgba(245, 158, 11, 0.5);
    }

    .mic-btn.preparing::before {
      animation: pulse-ring 1.5s infinite ease-out;
      background-color: hsl(35, 95%, 55%);
    }

    .mic-btn.listening {
      background: linear-gradient(135deg, var(--accent-color) 0%, hsl(330, 90%, 50%) 100%);
      box-shadow: 0 8px 30px rgba(236, 72, 153, 0.6);
    }

    .mic-btn.listening::before {
      animation: pulse-ring 1.5s infinite ease-out;
      background-color: var(--accent-color);
    }

    .mic-btn svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .status-label {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-label.preparing {
      color: hsl(35, 95%, 55%);
    }

    .status-label.listening {
      color: var(--accent-color);
    }

    /* Console de Debug para Celular */
    .debug-log {
      width: 100%;
      max-width: 500px;
      margin-top: 15px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      color: hsl(120, 100%, 75%);
      max-height: 110px;
      overflow-y: auto;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(1);
        opacity: 0.4;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Identificação da Versão no Topo -->
  <div class="top-version-bar">
    testes/construtor_de_comandos/t1.2_construtor.html - v1.2
  </div>

  <header>
    <h1>Reconhecedor de Voz</h1>
    <p>Toque no botão e fale para ver o resultado</p>
  </header>

  <main>
    <!-- Card de Transcrição -->
    <section class="recognition-card" id="card-display">
      <div class="text-output text-placeholder" id="text-output">
        O texto falado aparecerá aqui...
      </div>
    </section>

    <!-- Controles -->
    <section class="controls-container">
      <button class="mic-btn" id="mic-btn" aria-label="Ativar Reconhecimento de Voz">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
        </svg>
      </button>
      <div class="status-label" id="status-label">Pronto</div>
      <div style="font-size: 0.75rem; color: var(--text-muted); font-style: italic; margin-top: -5px; text-align: center; max-width: 250px; line-height: 1.3;" id="tip-label">Aguarde o sinal sonoro do celular antes de começar a falar</div>
    </section>

    <!-- Console de Debug -->
    <div style="width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: bold; letter-spacing: 0.05em;">Logs de Depuração</span>
        <button id="clear-debug-btn" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-family: var(--font-display); transition: all 0.2s;">Limpar Logs</button>
      </div>
      <div class="debug-log" id="debug-log">
        Sistemas prontos para depuração.
      </div>
    </div>
  </main>

  <script>
    const micBtn = document.getElementById('mic-btn');
    const statusLabel = document.getElementById('status-label');
    const textOutput = document.getElementById('text-output');
    const cardDisplay = document.getElementById('card-display');
    const debugLog = document.getElementById('debug-log');

    let isListening = false;

    // Função de Logging na Tela
    function logDebug(msg) {
      const time = new Date().toLocaleTimeString();
      debugLog.innerHTML = `[${time}] ${msg}<br>` + debugLog.innerHTML;
    }

    // Configurando a Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      logDebug("SpeechRecognition detectado.");
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      
      // Ajustes de Otimização e Estabilidade
      recognition.continuous = true; // Mantém o microfone aberto mesmo com silêncio
      recognition.interimResults = true; // Transcrição dinâmica em tempo real
      recognition.maxAlternatives = 1;

      // Evento de Resultado
      recognition.onresult = (event) => {
        logDebug("onresult disparado.");
        
        let transcript = '';
        // Para iOS, iteramos a partir de 0 reconstrói a string inteira consistentemente
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }

        logDebug(`Texto atual: "${transcript}"`);
        textOutput.textContent = transcript;
        textOutput.classList.remove('text-placeholder');
      };

      // Início do Reconhecimento (Pronto para escutar)
      recognition.onstart = () => {
        logDebug("onstart disparado (Pronto para Falar).");
        isListening = true;
        
        // Altera o visual do botão para o estado final de captura (Vermelho)
        micBtn.classList.remove('preparing');
        micBtn.classList.add('listening');
        cardDisplay.classList.add('active');
        
        statusLabel.textContent = "Fale agora!";
        statusLabel.classList.remove('preparing');
        statusLabel.classList.add('listening');
      };

      // Fim do Reconhecimento
      recognition.onend = () => {
        logDebug("onend disparado (parou de escutar).");
        isListening = false;
        
        // Remove todos os estados de escuta/preparação
        micBtn.classList.remove('preparing', 'listening');
        cardDisplay.classList.remove('active');
        
        statusLabel.textContent = "Pronto";
        statusLabel.classList.remove('preparing', 'listening');
      };

      // Tratamento de Erro
      recognition.onerror = (event) => {
        logDebug(`onerror disparado: ${event.error}`);
        statusLabel.textContent = `Erro: ${event.error}`;
        isListening = false;
        
        micBtn.classList.remove('preparing', 'listening');
        cardDisplay.classList.remove('active');
        statusLabel.classList.remove('preparing', 'listening');
      };

    } else {
      logDebug("Erro: SpeechRecognition NÃO é suportado.");
      statusLabel.textContent = "Reconhecimento não suportado";
      textOutput.textContent = "Este navegador não suporta a API de Reconhecimento de Voz.";
      micBtn.style.opacity = '0.5';
      micBtn.style.cursor = 'not-allowed';
    }

    // Clique Físico no Botão
    micBtn.addEventListener('click', () => {
      if (!recognition) return;

      if (isListening) {
        logDebug("Parando gravação manualmente...");
        recognition.stop();
      } else {
        logDebug("Preparando áudio (inicializando microfone)...");
        textOutput.textContent = "";
        textOutput.classList.remove('text-placeholder');
        
        // Altera o visual do botão para o estado inicial de carregamento (Laranja)
        micBtn.classList.add('preparing');
        statusLabel.textContent = "Aguardando...";
        statusLabel.classList.add('preparing');
        
        try {
          recognition.start();
        } catch (e) {
          logDebug(`Erro ao iniciar: ${e.message}`);
          micBtn.classList.remove('preparing');
          statusLabel.classList.remove('preparing');
        }
      }
    });

    // Limpar console e transcrição
    const clearDebugBtn = document.getElementById('clear-debug-btn');
    clearDebugBtn.addEventListener('click', () => {
      debugLog.innerHTML = "Logs limpos.";
      textOutput.textContent = "O texto falado aparecerá aqui...";
      textOutput.classList.add('text-placeholder');
      logDebug("Console resetado.");
    });
  </script>
</body>

</html>
