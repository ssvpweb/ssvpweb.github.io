<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reconhecimento de Voz Simples - SSVP</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: hsl(222, 47%, 7%);
      --card-bg: hsl(222, 40%, 12%);
      --primary-color: hsl(250, 95%, 70%);
      --primary-glow: hsla(250, 95%, 70%, 0.2);
      --accent-color: hsl(330, 90%, 60%);
      --accent-glow: hsla(330, 90%, 60%, 0.25);
      --text-main: hsl(210, 40%, 98%);
      --text-muted: hsl(215, 20%, 65%);
      --border-color: rgba(255, 255, 255, 0.06);
      
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      padding-bottom: calc(40px + var(--safe-bottom));
      justify-content: space-between;
    }

    /* Identificação da Versão no Topo (Regra do Workspace) */
    .top-version-bar {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.6;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, var(--primary-color) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    main {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-grow: 1;
      justify-content: center;
    }

    /* Card de Transcrição */
    .recognition-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      transition: border-color 0.3s;
    }

    .recognition-card.active {
      border-color: var(--accent-color);
      box-shadow: 0 10px 30px var(--accent-glow);
    }

    .text-output {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 500;
      text-align: center;
      line-height: 1.5;
      color: var(--text-main);
      word-break: break-word;
    }

    .text-placeholder {
      font-size: 1rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Controles do Microfone */
    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .mic-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color) 0%, hsl(250, 95%, 60%) 100%);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .mic-btn::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: var(--primary-color);
      opacity: 0.2;
      z-index: -1;
    }

    .mic-btn:active {
      transform: scale(0.92);
    }

    .mic-btn.listening {
      background: linear-gradient(135deg, var(--accent-color) 0%, hsl(330, 90%, 50%) 100%);
      box-shadow: 0 8px 30px rgba(236, 72, 153, 0.6);
    }

    .mic-btn.listening::before {
      animation: pulse-ring 1.5s infinite ease-out;
      background-color: var(--accent-color);
    }

    .mic-btn svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .status-label {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-label.listening {
      color: var(--accent-color);
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(1);
        opacity: 0.4;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Identificação da Versão no Topo -->
  <div class="top-version-bar">
    testes/construtor_de_comandos/v1_construtor.html - v1.1
  </div>

  <header>
    <h1>Reconhecedor de Voz</h1>
    <p>Toque no botão e fale para ver o resultado</p>
  </header>

  <main>
    <!-- Card de Transcrição -->
    <section class="recognition-card" id="card-display">
      <div class="text-output text-placeholder" id="text-output">
        O texto falado aparecerá aqui...
      </div>
    </section>

    <!-- Controles -->
    <section class="controls-container">
      <button class="mic-btn" id="mic-btn" aria-label="Ativar Reconhecimento de Voz">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
        </svg>
      </button>
      <div class="status-label" id="status-label">Pronto</div>
    </section>
  </main>

  <script>
    const micBtn = document.getElementById('mic-btn');
    const statusLabel = document.getElementById('status-label');
    const textOutput = document.getElementById('text-output');
    const cardDisplay = document.getElementById('card-display');

    let isListening = false;

    // Configurando a Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.interimResults = true; // Transcrição dinâmica em tempo real
      recognition.maxAlternatives = 1;

      // Evento de Resultado
      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = 0; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }

        // Atualiza a tela com o texto falado
        textOutput.textContent = transcript;
        textOutput.classList.remove('text-placeholder');
      };

      // Início do Reconhecimento
      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        cardDisplay.classList.add('active');
        statusLabel.textContent = "Ouvindo...";
        statusLabel.classList.add('listening');
      };

      // Fim do Reconhecimento
      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        cardDisplay.classList.remove('active');
        statusLabel.textContent = "Pronto";
        statusLabel.classList.remove('listening');
      };

      // Tratamento de Erro
      recognition.onerror = (event) => {
        console.error("Erro no reconhecimento de voz:", event.error);
        statusLabel.textContent = `Erro: ${event.error}`;
        isListening = false;
        micBtn.classList.remove('listening');
        cardDisplay.classList.remove('active');
      };

    } else {
      statusLabel.textContent = "Reconhecimento não suportado";
      textOutput.textContent = "Este navegador não suporta a API de Reconhecimento de Voz.";
      micBtn.style.opacity = '0.5';
      micBtn.style.cursor = 'not-allowed';
    }

    // Clique Físico no Botão
    micBtn.addEventListener('click', () => {
      if (!recognition) return;

      if (isListening) {
        recognition.stop();
      } else {
        textOutput.textContent = "";
        textOutput.classList.remove('text-placeholder');
        
        try {
          recognition.start();
        } catch (e) {
          console.error(e);
        }
      }
    });
  </script>
</body>

</html>
