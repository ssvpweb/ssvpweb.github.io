<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template de Teste Padrão - SSVP</title>
  <!-- Link para o CSS Externo básico -->
  <link rel="stylesheet" href="teste_padrao.css">
  <!-- Fonte Inter para tipografia premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cabeçalho com Versão e Card de Destaque da Funcionalidade (Centralizados) -->
  <header class="teste-header">
    <div class="teste-versao">teste v1.2</div>
    <div class="card-funcionalidade">
      <h1 class="teste-funcionalidade">Google Maps</h1>
    </div>
  </header>

  <!-- Card de Instruções (Inicia aberto com classes ativo e expanded) -->
  <section class="card-instrucoes ativo" id="cardInstrucoes">
    <div class="card-header" onclick="toggleInstrucoes()">
      <span>Instruções do Teste</span>
      <span class="seta-toggle" id="setaToggle" style="transform: rotate(180deg);">▼</span>
    </div>
    <!-- Wrapper do Grid -->
    <div class="card-content-wrapper expanded" id="contentWrapper">
      <!-- Container intermediário necessário para colapso total do padding no grid -->
      <div class="card-content">
        <div class="card-body">
          <p>1. Verifique as informações da funcionalidade que está sob teste abaixo.</p>
          <p>2. Utilize a área abaixo para interagir e validar a funcionalidade do teste.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Área dedicada para o Teste Específico -->
  <main class="teste-container">
    <div class="teste-placeholder" id="areaTeste">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 0.75rem; opacity: 0.6;">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <span>[Área reservada para a funcionalidade do teste]</span>
    </div>
  </main>

  <script>
    // Lógica para expandir/recolher o card de instruções
    function toggleInstrucoes() {
      const card = document.getElementById('cardInstrucoes');
      const wrapper = document.getElementById('contentWrapper');
      const seta = document.getElementById('setaToggle');
      
      const isExpanded = wrapper.classList.toggle('expanded');
      card.classList.toggle('ativo', isExpanded);
      
      // Rotaciona a seta
      seta.style.transform = isExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
    }
  </script>
</body>
</html>
