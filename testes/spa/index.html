<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSVP - Aplicativo de Visitas (SPA)</title>
  <link rel="stylesheet" href="global.css">
  <style>
    /* Estilos Específicos para a tela de Login (dentro do SPA) */
    .login-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 80vh;
      gap: 1.5rem;
    }

    .login-header {
      text-align: center;
      margin-bottom: 1rem;
    }

    .login-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      border-radius: var(--border-radius-lg);
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.25);
    }

    /* Estilos Específicos para Dashboard */
    .welcome-card {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      color: var(--text-inverse);
      border: none;
    }

    .welcome-card .text-muted {
      color: rgba(255, 255, 255, 0.7);
    }

    .sync-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: var(--border-radius-md);
      padding: 0.75rem 1rem;
    }

    .sync-banner.has-items {
      background-color: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .visita-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.875rem;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-md);
      transition: var(--transition-smooth);
      cursor: pointer;
    }

    body.light-mode .visita-item {
      background-color: rgba(0, 0, 0, 0.02);
    }

    .visita-item:hover, .visita-item:active {
      background-color: rgba(255, 255, 255, 0.06);
      border-color: var(--primary-color);
    }

    body.light-mode .visita-item:hover, body.light-mode .visita-item:active {
      background-color: rgba(0, 0, 0, 0.04);
    }

    .visita-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .visita-nome {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .visita-endereco {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85%;
    }

    .badge-status {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-status.pendente {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--warning-color);
    }

    .badge-status.caminho {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--primary-color);
      animation: pulsate 1.5s infinite;
    }

    .badge-status.concluida {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
    }

    .sync-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s linear infinite;
    }

    /* Estilos Específicos para Detalhes */
    .meta-item {
      padding: 0.75rem;
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-md);
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    body.light-mode .meta-item {
      background-color: rgba(0, 0, 0, 0.01);
    }

    .meta-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meta-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-color);
    }

    .meta-status {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .meta-status.pendente {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--warning-color);
    }

    .meta-status.andamento {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--primary-color);
    }

    .meta-status.concluida {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success-color);
    }

    .meta-desc {
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .audio-btn {
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.625rem;
      border-radius: var(--border-radius-md);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: var(--transition-smooth);
    }

    .audio-btn:hover, .audio-btn:active {
      background-color: var(--primary-color);
      color: var(--text-inverse);
    }

    .audio-btn.speaking {
      background-color: var(--success-color);
      color: var(--text-inverse);
      animation: pulse 1.5s infinite;
    }

    .maps-link {
      color: var(--primary-color);
      text-decoration: underline;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* Estilos Específicos para Visita */
    .active-badge {
      background-color: var(--danger-color);
      color: var(--text-inverse);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 4px;
      animation: flash 1.5s infinite;
    }

    .time-tracker {
      display: flex;
      justify-content: space-between;
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-md);
      padding: 12px;
      font-size: 0.85rem;
    }

    .time-tracker div {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mic-button-wrapper {
      display: flex;
      justify-content: flex-end;
      margin-top: -10px;
      margin-bottom: 8px;
    }

    .photo-area {
      border: 2px dashed var(--card-border);
      border-radius: var(--border-radius-md);
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition-smooth);
      position: relative;
    }

    .photo-area:hover, .photo-area:active {
      border-color: var(--primary-color);
      background-color: rgba(59, 130, 246, 0.02);
    }

    .preview-img {
      max-width: 100%;
      max-height: 180px;
      border-radius: var(--border-radius-md);
      display: none;
      margin-top: 12px;
    }

    .compression-log {
      display: none;
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--border-radius-md);
      padding: 10px;
      font-size: 0.8rem;
      color: var(--success-color);
      margin-top: 12px;
      text-align: left;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-group input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: var(--primary-color);
    }

    .checkbox-label {
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--text-main);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .empty-state-icon {
      width: 80px;
      height: 80px;
      background-color: var(--primary-glow);
      color: var(--primary-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .empty-state-icon svg {
      width: 40px;
      height: 40px;
      fill: currentColor;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulsate {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }

    @keyframes flash {
      0% { opacity: 0.8; }
      50% { opacity: 1; }
      100% { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <!-- Header Global Simétrico de 3 Colunas (Controles | Título | Online) -->
  <header id="app-header" class="app-header" style="display: none;">
    <button class="btn-adjust" onclick="toggleUXTunerPanel()">Controles</button>
    <h1 class="page-title" id="app-page-title">Minhas Visitas</h1>
    <div id="btn-connection" class="connection-badge online" onclick="toggleConnection()">Online</div>
  </header>

  <!-- Container Geral onde as telas do SPA serão renderizadas -->
  <main id="app-content" class="container fade-in">
    <!-- Tela Ativa Renderizada Aqui -->
  </main>

  <!-- Barra de Navegação Acessível Inferior Global -->
  <nav id="app-nav-bar" class="nav-bar" style="display: none;">
    <a href="#dashboard" id="nav-link-visitas" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
      </svg>
      <span>Visitas</span>
    </a>
    
    <!-- Microfone Centralizado -->
    <div class="nav-mic-item">
      <button class="nav-mic-btn" onclick="abrirGavetaVoz()" title="Falar comando de voz">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
        </svg>
      </button>
    </div>
    
    <a href="#visita" id="nav-link-relatos" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
      </svg>
      <span>Relatos</span>
    </a>
  </nav>

  <!-- Lógica e Recursos Unificados do SPA -->
  <script>
    // Banco de Dados Simulados Globais
    const dadosAssistidosBase = {
      1: {
        nome: "Maria das Dores",
        cpf: "123.456.789-00",
        telefone: "(11) 98765-4321",
        endereco: "Avenida Paulista, 1000, Bela Vista, São Paulo - SP",
        metas: [
          { desc: "Comprar o remédio de pressão (Losartana) até sexta-feira.", status: "pendente", statusTxt: "Pendente" },
          { desc: "Agendar consulta com o cardiologista no Posto de Saúde.", status: "pendente", statusTxt: "Pendente" },
          { desc: "Matricular o filho caçula no curso profissionalizante.", status: "andamento", statusTxt: "Em Progresso" }
        ]
      },
      2: {
        nome: "João da Silva",
        cpf: "987.654.321-11",
        telefone: "(11) 91234-5678",
        endereco: "Rua Vergueiro, 1350, Paraíso, São Paulo - SP",
        metas: [
          { desc: "Concluir o tratamento de fisioterapia domiciliar.", status: "andamento", statusTxt: "Em Progresso" },
          { desc: "Trocar as telhas da cozinha antes do período de chuvas.", status: "pendente", statusTxt: "Pendente" }
        ]
      },
      3: {
        nome: "Ana Souza",
        cpf: "456.789.123-22",
        telefone: "(11) 94567-8912",
        endereco: "Rua Domingos de Morais, 2000, Vila Mariana, São Paulo - SP",
        metas: [
          { desc: "Resolver a pendência no Cadastro Único (Bolsa Família).", status: "concluida", statusTxt: "Concluída" },
          { desc: "Entregar a documentação para o auxílio-gás.", status: "concluida", statusTxt: "Concluída" }
        ]
      }
    };

    const agendaVisitasPadrao = [
      { id: 1, nome: "Maria das Dores", endereco: "Avenida Paulista, 1000, Bela Vista, São Paulo - SP", status: "Pendente" },
      { id: 2, nome: "João da Silva", endereco: "Rua Vergueiro, 1350, Paraíso, São Paulo - SP", status: "Pendente" },
      { id: 3, nome: "Ana Souza", endereco: "Rua Domingos de Morais, 2000, Vila Mariana, São Paulo - SP", status: "Concluída" }
    ];

    // Estados locais persistentes da aplicação
    let currentScreen = "login";
    let isOnline = true;
    let speakingUtterance = null;
    let speaking = false;
    let photoDataUrl = null;
    let isRecordingRelato = false;
    let localRecognition = null;

    // Inicialização do LocalStorage caso vazio
    if (!localStorage.getItem("dashboard_visitas")) {
      localStorage.setItem("dashboard_visitas", JSON.stringify(agendaVisitasPadrao));
    }

    // ----------------------------------------------------
    // ROTEADOR SPA (Baseado em Hash)
    // ----------------------------------------------------
    function router() {
      const hash = window.location.hash || "#login";
      
      // Proteção de rota
      const logado = localStorage.getItem("vicentino_logado") === "true";
      if (!logado && hash !== "#login") {
        window.location.hash = "#login";
        return;
      }
      if (logado && hash === "#login") {
        window.location.hash = "#dashboard";
        return;
      }

      currentScreen = hash.replace("#", "");
      fecharGavetaVoz(); // Garante fechar microfone ao trocar de tela

      const appContent = document.getElementById("app-content");
      const header = document.getElementById("app-header");
      const navBar = document.getElementById("app-nav-bar");

      // Configura visibilidade do Header e Nav-bar
      if (currentScreen === "login") {
        header.style.display = "none";
        navBar.style.display = "none";
        document.body.style.paddingBottom = "0";
      } else {
        header.style.display = "grid";
        navBar.style.display = "flex";
        document.body.style.paddingBottom = "calc(var(--nav-height) + 0.625rem)";
      }

      // Parar qualquer síntese de voz activa ao trocar de tela
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        speaking = false;
      }

      // Limpar marcadores de navegação ativos
      document.getElementById("nav-link-visitas").classList.remove("active");
      document.getElementById("nav-link-relatos").classList.remove("active");

      // Renderização e inicialização de tela correspondente
      if (currentScreen === "login") {
        appContent.innerHTML = renderTelaLogin();
        initTelaLogin();
      } else if (currentScreen === "dashboard") {
        document.getElementById("app-page-title").innerText = "Minhas Visitas";
        document.getElementById("nav-link-visitas").classList.add("active");
        appContent.innerHTML = renderTelaDashboard();
        initTelaDashboard();
      } else if (currentScreen === "detalhes") {
        const selId = localStorage.getItem("selected_assistido_id") || 1;
        const assistido = dadosAssistidosBase[selId] || dadosAssistidosBase[1];
        document.getElementById("app-page-title").innerText = assistido.nome;
        appContent.innerHTML = renderTelaDetalhes(selId);
        initTelaDetalhes(selId);
      } else if (currentScreen === "visita") {
        const ativaNome = localStorage.getItem("visita_ativa_nome");
        document.getElementById("app-page-title").innerText = ativaNome ? `Visita: ${ativaNome}` : "Registro de Visita";
        document.getElementById("nav-link-relatos").classList.add("active");
        appContent.innerHTML = renderTelaVisita();
        initTelaVisita();
      }

      // Re-aplica customizações dinâmicas do desenvolvedor após alteração de DOM
      aplicarEstilosSalvos();
    }

    // ----------------------------------------------------
    // TEMPLATES HTML (Telas)
    // ----------------------------------------------------
    function renderTelaLogin() {
      return `
        <div class="login-container">
          <div class="login-header">
            <div class="login-logo">Ω</div>
            <h2 class="font-bold" style="font-size: 1.5rem; letter-spacing: -0.02em;">Sistemas SSVP</h2>
            <p class="text-muted" style="font-size: 0.85rem;">Protótipo Móvel de Visitas e Acessibilidade</p>
          </div>
          
          <div class="card">
            <div class="card-title">Acesso Restrito</div>
            <form id="form-login" class="flex-column" style="gap: 12px;">
              <div class="form-group">
                <label class="form-label" for="login-email">E-mail do Vicentino</label>
                <input type="email" id="login-email" class="form-control" placeholder="vicentino.saojose@gmail.com" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="login-conf">Conferência São Vicente</label>
                <input type="text" id="login-conf" class="form-control" placeholder="Conferência de São José" required>
              </div>
              <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; margin-top: 6px;">Entrar no Painel</button>
            </form>
          </div>
        </div>
      `;
    }

    function renderTelaDashboard() {
      const email = localStorage.getItem("vicentino_email") || "vicentino.saojose@gmail.com";
      const conf = localStorage.getItem("vicentino_conf") || "Conferência de São José";
      return `
        <!-- Card de Boas-vindas -->
        <div class="card welcome-card">
          <div class="flex-row justify-between align-center" style="width: 100%;">
            <div class="flex-column" style="gap: 4px; max-width: calc(100% - 50px);">
              <span class="text-muted" style="font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Vicentino(a)</span>
              <h2 style="font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${email}</h2>
              <span style="font-size: 0.85rem; opacity: 0.9;">${conf}</span>
            </div>
            <button class="btn" style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; background-color: rgba(255, 255, 255, 0.1); border: none; color: #fff; display: flex; align-items: center; justify-content: center;" onclick="efetuarLogout()" title="Sair do aplicativo">
              <svg style="width: 22px; height: 22px; fill: currentColor;" viewBox="0 0 24 24">
                <path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Seção de Sincronização -->
        <div id="sync-card" class="sync-banner">
          <div class="flex-column" style="gap: 2px;">
            <span class="font-bold" id="sync-title" style="font-size: 0.85rem;">Dados Sincronizados</span>
            <span class="text-muted" id="sync-subtitle" style="font-size: 0.75rem;">Sem pendências locais</span>
          </div>
          <button id="btn-sync" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="syncData()" disabled>
            <span>Sincronizar</span>
            <div id="sync-spinner" class="sync-spinner"></div>
          </button>
        </div>

        <!-- Lista de Visitas -->
        <div class="card">
          <div class="card-title justify-between">
            <div style="display: flex; align-items: center; gap: 8px;">
              <svg style="width: 22px; height: 22px; fill: var(--primary-color);" viewBox="0 0 24 24">
                <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
              </svg>
              Agenda de Visitas
            </div>
            <span class="text-muted" id="visitas-count" style="font-size: 0.8rem; font-weight: normal;">0 visitas</span>
          </div>

          <div class="flex-column" id="lista-visitas" style="gap: 10px;">
            <!-- Injetado via Javascript -->
          </div>
        </div>
      `;
    }

    function renderTelaDetalhes(id) {
      const assistido = dadosAssistidosBase[id] || dadosAssistidosBase[1];
      return `
        <!-- Cartão com Dados Pessoais -->
        <div class="card">
          <div class="card-title">
            <svg style="width: 22px; height: 22px; fill: var(--primary-color);" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Dados Cadastrais
          </div>

          <div class="flex-column" style="gap: 12px;">
            <div>
              <span class="form-label">Nome Completo</span>
              <p class="font-bold" style="font-size: 1.1rem;">${assistido.nome}</p>
            </div>

            <div class="flex-row justify-between">
              <div>
                <span class="form-label">CPF</span>
                <p style="font-size: 0.95rem;">${assistido.cpf}</p>
              </div>
              <div style="text-align: right;">
                <span class="form-label">WhatsApp</span>
                <p id="info-telefone" style="font-size: 0.95rem; color: var(--primary-color); text-decoration: underline; cursor: pointer; display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; width: 100%;" onclick="abrirConversaWhatsapp()">
                  <!-- Injetado via JS -->
                </p>
              </div>
            </div>

            <div>
              <span class="form-label">Endereço de Visita</span>
              <p style="font-size: 0.9rem; line-height: 1.4;">${assistido.endereco}</p>
              <div class="maps-link" onclick="abrirRotaMaps()">

    function carregarVisitasDashboard() {
      const visitas = JSON.parse(localStorage.getItem("dashboard_visitas")) || agendaVisitasPadrao;
      
      // Ajusta status se houver visita ativa
      const ativaId = localStorage.getItem("visita_ativa_id");
      if (ativaId) {
        visitas.forEach(v => {
          if (v.id == ativaId && v.status !== "Concluída") {
            v.status = "Em Andamento";
          }
        });
      }

      // Renderiza lista
      const container = document.getElementById("lista-visitas");
      if (!container) return;
      container.innerHTML = "";
      
      document.getElementById("visitas-count").innerText = `${visitas.length} visitas`;

      visitas.forEach(v => {
        const item = document.createElement("div");
        item.className = "visita-item";
        item.onclick = () => {
          localStorage.setItem("selected_assistido_id", v.id);
          window.location.hash = "#detalhes";
        };
        
        let badgeClass = "badge-status pendente";
        let badgeText = "Pendente";
        
        if (v.status === "Em Andamento") {
          badgeClass = "badge-status caminho";
          badgeText = "Em campo";
        } else if (v.status === "Concluída") {
          badgeClass = "badge-status concluida";
          badgeText = "Concluída";
        }

        item.innerHTML = `
          <div class="visita-header">
            <span class="visita-nome">${v.nome}</span>
            <span class="${badgeClass}">${badgeText}</span>
          </div>
          <span class="visita-endereco">${v.endereco}</span>
        `;
        container.appendChild(item);
      });

      atualizarStatusSincronizacao();
    }

    // Iniciar Visita
    function iniciarVisita() {
      const selId = localStorage.getItem("selected_assistido_id") || 1;
      const assistido = dadosAssistidosBase[selId];
      
      localStorage.setItem("visita_ativa_id", selId);
      localStorage.setItem("visita_ativa_nome", assistido.nome);
      localStorage.setItem("visita_ativa_endereco", assistido.endereco);
      localStorage.setItem("visita_ativa_hora_inicio", new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));

      // Atualiza status local
      const dbVisitas = JSON.parse(localStorage.getItem("dashboard_visitas"));
      const vObj = dbVisitas.find(dv => dv.id == selId);
      if (vObj && vObj.status !== "Concluída") {
        vObj.status = "Em Andamento";
      }
      localStorage.setItem("dashboard_visitas", JSON.stringify(dbVisitas));

      // Fala confirmação de voz
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const confSpeech = new SpeechSynthesisUtterance(`Iniciando visita para ${assistido.nome}. Boa caminhada.`);
        confSpeech.lang = "pt-BR";
        window.speechSynthesis.speak(confSpeech);
      }

      setTimeout(() => {
        abrirRotaMaps();
        window.location.hash = "#visita";
      }, 850);
    }

    function registrarChegada() {
      const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      localStorage.setItem("visita_ativa_hora_chegada", hora);
      
      const txt = document.getElementById("txt-hora-chegada");
      const btn = document.getElementById("btn-chegada");
      if (txt) txt.innerText = hora;
      if (btn) btn.style.display = "none";
    }

    // Concluir Visita
    function finalizarVisita() {
      const relato = document.getElementById("txt-relato").value;
      const chkLgpd = document.getElementById("chk-lgpd").checked;
      const ativaId = localStorage.getItem("visita_ativa_id");
      const ativaNome = localStorage.getItem("visita_ativa_nome");
      const horaSaida = localStorage.getItem("visita_ativa_hora_inicio");
      const horaChegada = localStorage.getItem("visita_ativa_hora_chegada") || "";

      if (!chkLgpd) {
        alert("Atenção: É obrigatório que a família tenha assinado o termo de consentimento LGPD antes de concluir o registro!");
        return;
      }

      const visitasSalvas = JSON.parse(localStorage.getItem("visitas")) || [];
      const novaVisita = {
        id_visita: gerarUUID(),
        id_assistido: ativaId,
        nome_assistido: ativaNome,
        data: new Date().toLocaleDateString('pt-BR'),
        hora_saida: horaSaida,
        hora_chegada: horaChegada,
        relato: relato || "Nenhum relato registrado.",
        foto_base64: photoDataUrl || null,
        sincronizado: false
      };

      visitasSalvas.push(novaVisita);
      localStorage.setItem("visitas", JSON.stringify(visitasSalvas));

      const dbVisitas = JSON.parse(localStorage.getItem("dashboard_visitas"));
      const vObj = dbVisitas.find(dv => dv.id == ativaId);
      if (vObj) {
        vObj.status = "Concluída";
      }
      localStorage.setItem("dashboard_visitas", JSON.stringify(dbVisitas));

      // Limpa os estados de visita ativa
      limparEstadosVisitaAtiva();

      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance("Visita concluída e salva localmente.");
        speech.lang = "pt-BR";
        window.speechSynthesis.speak(speech);
      }

      alert("Visita salva com sucesso na memória do celular! Ela está agendada na fila de sincronização offline.");
      window.location.hash = "#dashboard";
    }

    function cancelarVisita() {
      if (confirm("Deseja interromper a visita ativa? Os dados digitados serão perdidos.")) {
        const ativaId = localStorage.getItem("visita_ativa_id");
        limparEstadosVisitaAtiva();

        const dbVisitas = JSON.parse(localStorage.getItem("dashboard_visitas"));
        const vObj = dbVisitas.find(dv => dv.id == ativaId);
        if (vObj && vObj.status === "Em Andamento") {
          vObj.status = "Pendente";
        }
        localStorage.setItem("dashboard_visitas", JSON.stringify(dbVisitas));

        window.location.hash = "#dashboard";
      }
    }

    function limparEstadosVisitaAtiva() {
      localStorage.removeItem("visita_ativa_id");
      localStorage.removeItem("visita_ativa_nome");
      localStorage.removeItem("visita_ativa_endereco");
      localStorage.removeItem("visita_ativa_hora_inicio");
      localStorage.removeItem("visita_ativa_hora_chegada");
    }

    function gerarUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // Leitura por Voz de Metas
    function ouvirMetas() {
      if (!window.speechSynthesis) {
        alert("O seu navegador não possui suporte para leitura de voz.");
        return;
      }

      const selId = localStorage.getItem("selected_assistido_id") || 1;
      const assistido = dadosAssistidosBase[selId];
      const btn = document.getElementById("btn-ouvir");
      const btnSpan = btn.querySelector("span");

      if (speaking) {
        window.speechSynthesis.cancel();
        speaking = false;
        btn.classList.remove("speaking");
        btnSpan.innerText = "Ouvir Metas (Audio)";
        return;
      }

      let textoParaFalar = `Lendo metas de ${assistido.nome}. `;
      assistido.metas.forEach((m, idx) => {
        textoParaFalar += `Meta ${idx + 1}: ${m.desc}. Status: ${m.statusTxt}. `;
      });

      speakingUtterance = new SpeechSynthesisUtterance(textoParaFalar);
      speakingUtterance.lang = "pt-BR";
      
      speakingUtterance.onstart = () => {
        speaking = true;
        btn.classList.add("speaking");
        btnSpan.innerText = "Parar Leitura";
      };

      speakingUtterance.onend = () => {
        speaking = false;
        btn.classList.remove("speaking");
        btnSpan.innerText = "Ouvir Metas (Audio)";
      };

      speakingUtterance.onerror = () => {
        speaking = false;
        btn.classList.remove("speaking");
        btnSpan.innerText = "Ouvir Metas (Audio)";
      };

      window.speechSynthesis.speak(speakingUtterance);
    }

    // ----------------------------------------------------
    // COMPRESSÃO LOCAL DE IMAGENS
    // ----------------------------------------------------
    function handleFileChange(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          
          const max_size = 1024;
          if (width > height) {
            if (width > max_size) {
              height *= max_size / width;
              width = max_size;
            }
          } else {
            if (height > max_size) {
              width *= max_size / height;
              height = max_size;
            }
          }
          
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          
          const dataUrl = canvas.toDataURL("image/jpeg", 0.55);
          photoDataUrl = dataUrl;

          const compressedSizeBytes = Math.round((dataUrl.length - 22) * 3 / 4);
          
          const preview = document.getElementById("preview-foto");
          if (preview) {
            preview.src = dataUrl;
            preview.style.display = "block";
          }
          
          const camIcon = document.getElementById("cam-icon");
          if (camIcon) camIcon.style.display = "none";
          
          const photoInst = document.getElementById("photo-instruction");
          if (photoInst) photoInst.innerText = "Foto Selecionada";

          const origSizeMB = (file.size / (1024 * 1024)).toFixed(2);
          const compSizeKB = (compressedSizeBytes / 1024).toFixed(1);
          const reduction = ((1 - (compressedSizeBytes / file.size)) * 100).toFixed(0);

          const logDiv = document.getElementById("compression-info");
          if (logDiv) {
            logDiv.innerHTML = `
              <strong>Compactação Concluída com Sucesso!</strong><br>
              • Tamanho Original: ${origSizeMB} MB<br>
              • Tamanho Otimizado: ${compSizeKB} KB (Redução de ${reduction}%)<br>
              • Resolução: ${width}x${height}px
            `;
            logDiv.style.display = "block";
          }
        }
      }
    }

    // ----------------------------------------------------
    // DITADO POR VOZ (Local da Tela de Visita)
    // ----------------------------------------------------
    function inicializarDitadoLocal() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        const micBtn = document.getElementById("btn-mic-relato");
        if (micBtn) {
          micBtn.disabled = true;
          micBtn.style.backgroundColor = "var(--offline-color)";
        }
        return;
      }

      localRecognition = new SpeechRecognition();
      localRecognition.continuous = true;
      localRecognition.lang = 'pt-BR';
      localRecognition.interimResults = false;

      localRecognition.onstart = () => {
        isRecordingRelato = true;
        const btn = document.getElementById("btn-mic-relato");
        if (btn) btn.classList.add("recording");
      };

      localRecognition.onend = () => {
        isRecordingRelato = false;
        const btn = document.getElementById("btn-mic-relato");
        if (btn) btn.classList.remove("recording");
      };

      localRecognition.onresult = (event) => {
        const index = event.resultIndex;
        const resultado = event.results[index][0].transcript;
        const textarea = document.getElementById("txt-relato");
        if (textarea) textarea.value += (textarea.value ? " " : "") + resultado;
      };

      localRecognition.onerror = (e) => {
        console.error("Erro reconhecimento local: ", e.error);
        isRecordingRelato = false;
        const btn = document.getElementById("btn-mic-relato");
        if (btn) btn.classList.remove("recording");
      };
    }

    // Toggle para ditado de voz
    function toggleRelatoVoz() {
      if (!localRecognition) return;
      if (isRecordingRelato) {
        localRecognition.stop();
      } else {
        localRecognition.start();
      }
    }

    // ----------------------------------------------------
    // GERENCIADOR DE CONEXÃO & SINCRONIZAÇÃO OFFLINE
    // ----------------------------------------------------
    if (localStorage.getItem("sim_online") !== null) {
      isOnline = localStorage.getItem("sim_online") === "true";
    }

    function toggleConnection() {
      isOnline = !isOnline;
      localStorage.setItem("sim_online", isOnline ? "true" : "false");
      atualizarBadgeConexao();
    }

    function atualizarBadgeConexao() {
      const badge = document.getElementById("btn-connection");
      if (!badge) return;

      const btnSync = document.getElementById("btn-sync");

      if (isOnline) {
        badge.innerText = "Online";
        badge.className = "connection-badge online";
        atualizarStatusSincronizacao();
      } else {
        badge.innerText = "Offline";
        badge.className = "connection-badge offline";
        if (btnSync) btnSync.disabled = true;
      }
    }

    function atualizarStatusSincronizacao() {
      const syncCard = document.getElementById("sync-card");
      if (!syncCard) return;

      const syncTitle = document.getElementById("sync-title");
      const syncSubtitle = document.getElementById("sync-subtitle");
      const btnSync = document.getElementById("btn-sync");

      const visitasConcluidasLocais = JSON.parse(localStorage.getItem("visitas")) || [];
      const pendentesCount = visitasConcluidasLocais.filter(v => !v.sincronizado).length;

      if (pendentesCount > 0) {
        syncCard.className = "sync-banner has-items";
        syncTitle.innerText = `${pendentesCount} Visita(s) Pendente(s)`;
        syncTitle.style.color = "var(--warning-color)";
        syncSubtitle.innerText = "Salvas localmente no aparelho (offline)";
        
        if (isOnline) {
          btnSync.disabled = false;
          btnSync.className = "btn btn-primary";
        } else {
          btnSync.disabled = true;
          btnSync.className = "btn btn-secondary";
        }
      } else {
        syncCard.className = "sync-banner";
        syncTitle.innerText = "Dados Sincronizados";
        syncTitle.style.color = "var(--text-main)";
        syncSubtitle.innerText = "Sem pendências locais";
        btnSync.disabled = true;
        btnSync.className = "btn btn-secondary";
      }
    }

    function syncData() {
      if (!isOnline) return;

      const btnSync = document.getElementById("btn-sync");
      const syncSpinner = document.getElementById("sync-spinner");
      const btnText = btnSync.querySelector("span");

      btnText.style.display = "none";
      syncSpinner.style.display = "inline-block";
      btnSync.disabled = true;

      setTimeout(() => {
        // Sincroniza visitas locais salvando flag
        const visitasLocais = JSON.parse(localStorage.getItem("visitas")) || [];
        visitasLocais.forEach(v => v.sincronizado = true);
        localStorage.setItem("visitas", JSON.stringify(visitasLocais));

        // Transfere status de concluído local para a lista
        const dbVisitas = JSON.parse(localStorage.getItem("dashboard_visitas")) || [];
        visitasLocais.forEach(vl => {
          const vObj = dbVisitas.find(dv => dv.id == vl.id_assistido);
          if (vObj) vObj.status = "Concluída";
        });
        localStorage.setItem("dashboard_visitas", JSON.stringify(dbVisitas));

        btnText.style.display = "inline-block";
        syncSpinner.style.display = "none";
        
        carregarVisitasDashboard();
      }, 1500);
    }

    // Fluxo de Logout
    function efetuarLogout() {
      localStorage.setItem("vicentino_logado", "false");
      localStorage.removeItem("vicentino_email");
      localStorage.removeItem("vicentino_conf");
      limparEstadosVisitaAtiva();
      window.location.hash = "#login";
    }

    // ----------------------------------------------------
    // AJUSTADOR DE ESTILOS EM CAMPO (UX Tuner Panel)
    // ----------------------------------------------------
    function inicializarUXTunerGlobal() {
      const tunerHtml = `
        <div id="ux-tuner-panel" class="ux-tuner-panel">
          <div style="font-weight: 700; font-size: 0.85rem; border-bottom: 1px solid var(--card-border); padding-bottom: 6px; margin-bottom: 6px; text-align: center;">
            Controles do Aplicativo
          </div>
          
          <!-- Seção de Acessibilidade (Vicentino) -->
          <div class="tuner-section">
            <h4>Acessibilidade</h4>
            <div class="ux-tuner-row">
              <span class="ux-tuner-label">Modo Claro</span>
              <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="alternarTema()">
                Alternar
              </button>
            </div>
            <div class="ux-tuner-row">
              <span class="ux-tuner-label">Fonte App</span>
              <div class="ux-tuner-controls">
                <div class="ux-tuner-btn" onclick="ajustarFonteApp(-1)">-</div>
                <span class="ux-tuner-value" id="val-app-font">16px</span>
                <div class="ux-tuner-btn" onclick="ajustarFonteApp(1)">+</div>
              </div>
            </div>
          </div>
          
          <!-- Seção do Desenvolvedor (UX/CSS Tuner) -->
          <div class="tuner-section" style="border-top: 1px solid var(--card-border); padding-top: 8px; margin-top: 4px;">
            <h4 style="color: var(--primary-color);">Desenvolvedor (Nav-Bar)</h4>
            <div class="ux-tuner-row">
              <span class="ux-tuner-label">Altura Barra</span>
              <div class="ux-tuner-controls">
                <div class="ux-tuner-btn" onclick="ajustarPropriedade('nav-height', -2)">-</div>
                <span class="ux-tuner-value" id="val-nav-height">84px</span>
                <div class="ux-tuner-btn" onclick="ajustarPropriedade('nav-height', 2)">+</div>
              </div>
            </div>

            <div class="ux-tuner-row">
              <span class="ux-tuner-label">Tamanho Ícone</span>
              <div class="ux-tuner-controls">
                <div class="ux-tuner-btn" onclick="ajustarPropriedade('nav-icon-size', -1)">-</div>
                <span class="ux-tuner-value" id="val-nav-icon-size">40px</span>
                <div class="ux-tuner-btn" onclick="ajustarPropriedade('nav-icon-size', 1)">+</div>
              </div>
            </div>

            <div class="ux-tuner-row">
              <span class="ux-tuner-label">Tamanho Fonte</span>
              <div class="ux-tuner-controls">
                <div class="ux-tuner-btn" onclick="ajustarPropriedade('nav-font-size', -1)">-</div>
                <span class="ux-tuner-value" id="val-nav-font-size">16px</span>
                <div class="ux-tuner-btn" onclick="ajustarPropriedade('nav-font-size', 1)">+</div>
              </div>
            </div>
          </div>
          
          <!-- Seção do Desenvolvedor (Editor CSS Genérico) -->
          <div class="tuner-section" style="border-top: 1px solid var(--card-border); padding-top: 8px; margin-top: 4px;">
            <h4 style="color: var(--primary-color);">Editor CSS em Tempo Real</h4>
            <div class="flex-column" style="gap: 4px;">
              <input type="text" id="dev-seletor" class="form-control" style="padding: 4px 8px; font-size: 0.75rem;" placeholder="Seletor (ex: .card, body)">
              <input type="text" id="dev-propriedade" class="form-control" style="padding: 4px 8px; font-size: 0.75rem;" placeholder="Propriedade (ex: margin, color)">
              <input type="text" id="dev-valor" class="form-control" style="padding: 4px 8px; font-size: 0.75rem;" placeholder="Valor (ex: 20px, red)">
              <button class="btn btn-primary" style="padding: 6px; font-size: 0.75rem;" onclick="aplicarCustomCSS()">Aplicar Regra</button>
            </div>
            
            <div id="dev-regras-lista" style="display: flex; flex-direction: column; gap: 4px; max-height: 80px; overflow-y: auto; margin-top: 4px;">
              <!-- Regras aplicadas vão aqui -->
            </div>
            <button class="btn btn-secondary btn-block" style="padding: 4px; font-size: 0.7rem;" onclick="limparTodasRegras()">
              Limpar Todos Estilos
            </button>
          </div>
          
          <!-- Ações Gerais -->
          <div style="border-top: 1px solid var(--card-border); padding-top: 8px; margin-top: 4px;">
            <button class="btn btn-danger btn-block" style="padding: 8px; font-size: 0.8rem;" onclick="efetuarLogout()">
              Sair do Aplicativo
            </button>
          </div>
        </div>
      `;
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = tunerHtml;
      document.body.appendChild(tempDiv.firstElementChild);

      // Aplica estilos salvos e monta lista do editor
      aplicarEstilosSalvos();
      renderizarRegrasList();

      // Fechamento ao clicar fora do painel de Controles
      document.addEventListener("click", function(event) {
        const panel = document.getElementById("ux-tuner-panel");
        const btn = document.querySelector(".btn-adjust");
        if (panel && panel.classList.contains("active")) {
          if (!panel.contains(event.target) && !btn.contains(event.target)) {
            panel.classList.remove("active");
          }
        }
      });
    }

    function toggleUXTunerPanel() {
      const panel = document.getElementById("ux-tuner-panel");
      if (panel) {
        panel.classList.toggle("active");
      }
    }

    function aplicarEstilosSalvos() {
      // 1. Tema (Claro / Escuro)
      const tema = localStorage.getItem("tuner_theme") || "dark";
      if (tema === "light") {
        document.body.classList.add("light-mode");
      } else {
        document.body.classList.remove("light-mode");
      }

      // 2. Fonte Geral do App
      const appFont = localStorage.getItem("tuner_app_font_size") || 16;
      document.documentElement.style.fontSize = `${appFont}px`;
      
      const appFontLabel = document.getElementById("val-app-font");
      if (appFontLabel) appFontLabel.innerText = `${appFont}px`;

      // 3. Propriedades da Nav-Bar (Convertendo de px para rem)
      const height = localStorage.getItem("tuner_nav_height") || 84;
      const icon = localStorage.getItem("tuner_nav_icon_size") || 40;
      const font = localStorage.getItem("tuner_nav_font_size") || 16;

      document.documentElement.style.setProperty('--nav-height', `${height / 16}rem`);
      document.documentElement.style.setProperty('--nav-icon-size', `${icon / 16}rem`);
      document.documentElement.style.setProperty('--nav-font-size', `${font / 16}rem`);

      atualizarTunerLabels(height, icon, font);
      atualizarBadgeConexao();
      
      // 4. Executa os estilos customizados adicionais do dev
      executarCustomCSS();
    }

    function atualizarTunerLabels(height, icon, font) {
      const hLabel = document.getElementById("val-nav-height");
      const iLabel = document.getElementById("val-nav-icon-size");
      const fLabel = document.getElementById("val-nav-font-size");

      if (hLabel) hLabel.innerText = `${height}px`;
      if (iLabel) iLabel.innerText = `${icon}px`;
      if (fLabel) fLabel.innerText = `${font}px`;
    }

    // Controle de Acessibilidade
    function alternarTema() {
      const temaAtual = localStorage.getItem("tuner_theme") || "dark";
      const novoTema = temaAtual === "dark" ? "light" : "dark";
      localStorage.setItem("tuner_theme", novoTema);
      aplicarEstilosSalvos();
    }

    function ajustarFonteApp(delta) {
      let appFont = parseInt(localStorage.getItem("tuner_app_font_size") || 16);
      appFont = Math.max(12, Math.min(26, appFont + delta));
      localStorage.setItem("tuner_app_font_size", appFont);
      aplicarEstilosSalvos();
    }

    // Controle de Desenvolvimento (Nav-bar)
    function ajustarPropriedade(prop, delta) {
      let height = parseInt(localStorage.getItem("tuner_nav_height") || 84);
      let icon = parseInt(localStorage.getItem("tuner_nav_icon_size") || 40);
      let font = parseInt(localStorage.getItem("tuner_nav_font_size") || 16);

      if (prop === 'nav-height') {
        height = Math.max(50, Math.min(120, height + delta));
        localStorage.setItem("tuner_nav_height", height);
      } else if (prop === 'nav-icon-size') {
        icon = Math.max(16, Math.min(60, icon + delta));
        localStorage.setItem("tuner_nav_icon_size", icon);
      } else if (prop === 'nav-font-size') {
        font = Math.max(10, Math.min(30, font + delta));
        localStorage.setItem("tuner_nav_font_size", font);
      }

      aplicarEstilosSalvos();
    }

    // Custom CSS do desenvolvedor
    function aplicarCustomCSS() {
      const seletor = document.getElementById("dev-seletor").value.trim();
      const propriedade = document.getElementById("dev-propriedade").value.trim();
      const valor = document.getElementById("dev-valor").value.trim();

      if (!seletor || !propriedade || !valor) return;

      let regras = JSON.parse(localStorage.getItem("tuner_custom_css") || "[]");
      regras = regras.filter(r => !(r.seletor === seletor && r.propriedade === propriedade));
      regras.push({ seletor, propriedade, valor });

      localStorage.setItem("tuner_custom_css", JSON.stringify(regras));

      document.getElementById("dev-seletor").value = "";
      document.getElementById("dev-propriedade").value = "";
      document.getElementById("dev-valor").value = "";

      aplicarEstilosSalvos();
      renderizarRegrasList();
    }

    function ejecutarCustomCSS() {
      const regras = JSON.parse(localStorage.getItem("tuner_custom_css") || "[]");
      regras.forEach(r => {
        try {
          const elementos = document.querySelectorAll(r.seletor);
          elementos.forEach(el => {
            if (r.propriedade.startsWith('--')) {
              el.style.setProperty(r.propriedade, r.valor);
            } else {
              el.style[r.propriedade] = r.valor;
            }
          });
        } catch (e) {
          console.error("Erro ao aplicar custom CSS: ", e);
        }
      });
    }

    function renderizarRegrasList() {
      const container = document.getElementById("dev-regras-lista");
      if (!container) return;
      container.innerHTML = "";

      const regras = JSON.parse(localStorage.getItem("tuner_custom_css") || "[]");
      if (regras.length === 0) {
        container.innerHTML = `<span style="font-size: 0.65rem; color: var(--text-muted); text-align: center;">Nenhuma regra dev activa</span>`;
        return;
      }

      regras.forEach((r, idx) => {
        const item = document.createElement("div");
        item.style.display = "flex";
        item.style.justifyContent = "space-between";
        item.style.alignItems = "center";
        item.style.fontSize = "0.65rem";
        item.style.backgroundColor = "rgba(255,255,255,0.03)";
        item.style.padding = "2px 6px";
        item.style.borderRadius = "4px";
        item.style.border = "1px solid var(--card-border)";

        item.innerHTML = `
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;">
            <strong>${r.seletor}</strong>: ${r.valor}
          </span>
          <span style="color: var(--danger-color); cursor: pointer; font-weight: bold; padding-left: 4px;" onclick="removerRegra(${idx})">X</span>
        `;
        container.appendChild(item);
      });
    }

    function removerRegra(idx) {
      let regras = JSON.parse(localStorage.getItem("tuner_custom_css") || "[]");
      regras.splice(idx, 1);
      localStorage.setItem("tuner_custom_css", JSON.stringify(regras));
      
      window.location.reload();
    }

    function limparTodasRegras() {
      localStorage.removeItem("tuner_custom_css");
      window.location.reload();
    }

    // ----------------------------------------------------
    // COMANDO DE VOZ GLOBAL (Drawer)
    // ----------------------------------------------------
    let globalRecognition = null;

    function inicializarControleVozGlobal() {
      const drawerHtml = `
        <div id="global-voice-drawer" class="voice-drawer">
          <div class="drawer-handle"></div>
          <span class="voice-status-title" id="voice-drawer-status">Ouvindo seu comando...</span>
          <div class="voice-indicator-circle" id="voice-drawer-indicator">
            <svg viewBox="0 0 24 24">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
          </div>
          <div class="voice-transcript-box" id="voice-drawer-transcript">Diga um comando de voz...</div>
          <div class="voice-commands-help">
            <strong>Tente falar:</strong><br>
            <code>"ir para visitas"</code> | <code>"ir para relatos"</code> | <code>"sair"</code>
          </div>
          <button class="btn btn-secondary btn-block" style="padding: 10px;" onclick="fecharGavetaVoz()">Fechar</button>
        </div>
      `;
      const tempDiv = document.createElement("div");
      tempDiv.innerHTML = drawerHtml;
      document.body.appendChild(tempDiv.firstElementChild);

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      globalRecognition = new SpeechRecognition();
      globalRecognition.continuous = false;
      globalRecognition.lang = 'pt-BR';
      globalRecognition.interimResults = false;

      globalRecognition.onstart = () => {
        document.getElementById("global-voice-drawer").classList.add("listening");
        document.getElementById("voice-drawer-status").innerText = "Ouvindo...";
        document.getElementById("voice-drawer-transcript").innerText = "Fale agora...";
      };

      globalRecognition.onend = () => {
        document.getElementById("global-voice-drawer").classList.remove("listening");
        document.getElementById("voice-drawer-status").innerText = "Analisando comando...";
      };

      globalRecognition.onresult = (event) => {
        const text = event.results[0][0].transcript.toLowerCase().trim();
        document.getElementById("voice-drawer-transcript").innerText = `"${text}"`;
        
        setTimeout(() => {
          if (text.includes("ir para visitas") || text.includes("ver visitas") || text.includes("visita")) {
            window.location.hash = "#dashboard";
          } else if (text.includes("ir para relatos") || text.includes("ver relato") || text.includes("relato")) {
            window.location.hash = "#visita";
          } else if (text.includes("sair") || text.includes("deslogar")) {
            efetuarLogout();
          } else {
            document.getElementById("voice-drawer-status").innerText = "Comando não reconhecido";
            document.getElementById("voice-drawer-transcript").innerText = `Não entendi: "${text}"`;
          }
        }, 850);
      };

      globalRecognition.onerror = (e) => {
        console.error("Erro no controle global de voz: ", e.error);
        document.getElementById("voice-drawer-status").innerText = "Erro no microfone: " + e.error;
      };
    }

    function abrirGavetaVoz() {
      const drawer = document.getElementById("global-voice-drawer");
      if (drawer) {
        drawer.classList.add("active");
        if (globalRecognition) {
          try {
            globalRecognition.start();
          } catch (e) {
            globalRecognition.stop();
          }
        }
      }
    }

    function fecharGavetaVoz() {
      const drawer = document.getElementById("global-voice-drawer");
      if (drawer) {
        drawer.classList.remove("active");
        if (globalRecognition) {
          globalRecognition.stop();
        }
      }
    }

    // ----------------------------------------------------
    // INICIALIZAÇÃO GERAL DO APP SPA
    // ----------------------------------------------------
    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', () => {
      inicializarUXTunerGlobal();
      inicializarControleVozGlobal();
      router();
    });
  </script>
