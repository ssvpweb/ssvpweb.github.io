<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visita Vicentina - OpenStreetMap T1</title>
  <!-- Link para o CSS Externo básico -->
  <link rel="stylesheet" href="../testes.css">
  <!-- Fonte Inter para tipografia premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Estilos locais complementares para o OpenStreetMap */
    .painel-busca {
      width: 100%;
      background-color: var(--ssvp-white);
      border: 1px solid var(--ssvp-gray-border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 2px 4px var(--ssvp-shadow);
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .form-row {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
    }
    
    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ssvp-navy);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap; /* Evita quebra de linha desalinhadora no celular */
    }
    
    .form-select, .form-input {
      width: 100%;
      height: var(--input-height, 48px); /* Altura ergonômica idêntica e fixa no celular */
      padding: 0 12px; /* Remove padding vertical */
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ssvp-text-main);
      background-color: var(--ssvp-light-blue);
      border: 1px solid var(--ssvp-gray-border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .form-select:focus, .form-input:focus {
      border-color: var(--ssvp-blue);
      box-shadow: 0 0 0 3px rgba(0, 127, 255, 0.15);
    }
    
    .btn-buscar {
      width: 100%;
      padding: var(--btn-padding, 14px);
      background-color: var(--ssvp-blue);
      color: var(--ssvp-white);
      font-weight: 700;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 127, 255, 0.2);
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    .btn-buscar:hover {
      background-color: #0066cc;
    }
    
    .btn-buscar:active {
      transform: scale(0.98);
    }
    
    /* Layout de Resultados */
    .status-painel {
      display: none; /* Inicia oculto */
      text-align: center;
      padding: 2rem 1rem;
      color: var(--ssvp-text-muted);
      width: 100%;
    }
    
    .spinner-busca {
      width: 32px;
      height: 32px;
      border: 3px solid var(--ssvp-light-blue);
      border-top-color: var(--ssvp-blue);
      border-radius: 50%;
      margin: 0 auto 0.75rem auto;
      animation: rodar 0.8s linear infinite;
    }
    
    .resultados-container {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    
    .card-resultado {
      border: 1px solid var(--ssvp-gray-border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: var(--card-margin-bottom, 1rem);
      background-color: var(--ssvp-white);
      box-shadow: 0 2px 4px var(--ssvp-shadow);
      width: 100%;
    }
    
    .card-resultado:last-child {
      margin-bottom: 0;
    }
    
    .card-resultado-header {
      background-color: var(--ssvp-light-blue);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    
    .card-resultado-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ssvp-navy);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    
    .badge-distancia {
      background-color: var(--ssvp-navy);
      color: var(--ssvp-white);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    
    .card-resultado-body {
      padding: 1.25rem 1rem;
    }
    
    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: var(--btn-padding, 14px);
      background-color: var(--ssvp-success);
      color: var(--ssvp-white);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
      transition: background-color 0.2s, transform 0.1s;
      outline: none;
    }
    
    .btn-maps:hover {
      background-color: #0f9f6e;
    }
    
    .btn-maps:active {
      transform: scale(0.97);
    }
    
    @keyframes rodar {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Área dedicada para o Teste Específico (OpenStreetMap Nominatim) -->
  <main class="teste-container">
    
    <!-- Painel de Busca com Inputs Alinhados no Celular -->
    <section class="painel-busca">
      <div class="form-row">
        <!-- Campo Dropdown Acessível para Categorias -->
        <div class="form-group">
          <label class="form-label" for="selectCategoria">Localizar:</label>
          <select class="form-select" id="selectCategoria">
            <option value="bakery">🍞 Padaria</option>
            <option value="pharmacy" selected>💊 Farmácia</option>
            <option value="supermarket">🛒 Supermercado</option>
            <option value="hospital">🏥 Hospital</option>
          </select>
        </div>
        
        <!-- Campo Dropdown para Raio de Busca -->
        <div class="form-group">
          <label class="form-label" for="selectRaio">Raio Máximo:</label>
          <select class="form-select" id="selectRaio">
            <option value="1000">1 km (Perto)</option>
            <option value="2000" selected>2 km</option>
            <option value="3000">3 km</option>
            <option value="5000">5 km (Longe)</option>
          </select>
        </div>
      </div>
      
      <button class="btn-buscar" onclick="buscarEstabelecimentosOSM()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Buscar Agora
      </button>
    </section>

    <!-- Painel de Status (Spinner / Erro) -->
    <div class="status-painel" id="statusPainel">
      <div class="spinner-busca" id="statusSpinner"></div>
      <span id="statusTexto">Carregando coordenadas...</span>
    </div>

    <!-- Container de Injeção de Resultados -->
    <div class="resultados-container" id="resultadosContainer">
      <!-- Cards gerados dinamicamente via JS do OSM -->
    </div>

  </main>

  <!-- Script dos Testes -->
  <script src="../testes.js"></script>
  <script>
    // Inicializa a Sandbox
    inicializarSandbox({
      id_teste: "osm_busca_raio",
      titulo: "OpenStreetMap - Busca por Raio",
      versao: "teste v1.1",
      instrucoes: [
        "Selecione o estabelecimento e o raio de busca nas caixas de seleção.",
        "Toque em 'Buscar Agora'. O sistema usará a geolocalização do seu celular para pesquisar na API do OpenStreetMap (Nominatim).",
        "A pesquisa é restrita estritamente à região metropolitana de São Paulo (Bounding Box) para evitar custos e dados fora de escopo.",
        "Calibre os sliders do painel de ajustes acima para testar a ergonomia de altura dos inputs e dos botões."
      ],
      controles: [
        { variavel: "--btn-padding", label: "Padding dos Botões", tipo: "range", min: 8, max: 24, padrao: 14, unit: "px" },
        { variavel: "--input-height", label: "Altura dos Inputs", tipo: "range", min: 36, max: 64, padrao: 48, unit: "px" },
        { variavel: "--card-margin-bottom", label: "Margem entre Resultados", tipo: "range", min: 8, max: 32, padrao: 16, unit: "px" }
      ]
    });

    // Bounding Box para São Paulo (Restrição geográfica para evitar dados absurdos fora de rota)
    // Formato: [minLat, maxLat, minLon, maxLon]
    const VIEWBOX_SP = "-23.7250,-23.3830,-46.8260,-46.3650";

    // Função Principal de Busca Geográfica no OpenStreetMap (Nominatim API)
    function buscarEstabelecimentosOSM() {
      const selectCategoria = document.getElementById('selectCategoria');
      const selectRaio = document.getElementById('selectRaio');
      const statusPainel = document.getElementById('statusPainel');
      const statusSpinner = document.getElementById('statusSpinner');
      const statusTexto = document.getElementById('statusTexto');
      const resultadosContainer = document.getElementById('resultadosContainer');

      const categoria = selectCategoria.value;
      const raioMetros = parseInt(selectRaio.value);

      // Limpa visualização anterior
      resultadosContainer.innerHTML = '';
      statusPainel.style.display = 'block';
      statusSpinner.style.display = 'block';
      statusTexto.innerText = "Solicitando permissão de GPS do celular...";

      // Verifica suporte a Geolocalização (GPS)
      if (!navigator.geolocation) {
        exibirErro("Seu celular ou navegador não possui suporte a GPS.");
        return;
      }

      // Obtém coordenadas reais do usuário (GPS do celular)
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          
          statusTexto.innerText = `GPS obtido! Buscando ${selectCategoria.options[selectCategoria.selectedIndex].text.split(' ')[1]}s próximos no OpenStreetMap...`;

          // URL de pesquisa do Nominatim (OpenStreetMap)
          // Restringindo por Viewbox (São Paulo) e forçando a busca por categoria estruturada
          const urlOSM = `https://nominatim.openstreetmap.org/search?format=json&q=[${categoria}]&lat=${lat}&lon=${lon}&viewbox=${VIEWBOX_SP}&bounded=1&addressdetails=1&limit=8&accept-language=pt-br`;

          fetch(urlOSM, {
            headers: {
              'User-Agent': 'SSVP-Web-App-Test-Laboratorio' // Nominatim exige User-Agent descritivo para evitar bloqueio
            }
          })
          .then(res => {
            if (!res.ok) throw new Error("Erro na comunicação com a API do OpenStreetMap.");
            return res.json();
          })
          .then(data => {
            if (data.length === 0) {
              exibirErro(`Nenhum estabelecimento da categoria localizado nas proximidades.`);
              return;
            }

            // Filtra os resultados que estão dentro do raio de distância linear selecionado
            const resultadosFiltrados = data.filter(item => {
              const itemLat = parseFloat(item.lat);
              const itemLon = parseFloat(item.lon);
              const dist = calcularDistanciaLinear(lat, lon, itemLat, itemLon);
              return (dist * 1000) <= raioMetros;
            });

            if (resultadosFiltrados.length === 0) {
              exibirErro(`Encontrados locais em SP, mas nenhum dentro do raio de ${raioMetros/1000} km.`);
              return;
            }

            // Renderiza na tela
            renderizarResultados(resultadosFiltrados, lat, lon);
          })
          .catch(err => {
            console.error(err);
            exibirErro("Falha de rede ao acessar a API do OpenStreetMap. Verifique sua conexão de internet.");
          });
        },
        (error) => {
          console.warn("GPS negado ou indisponível, usando coordenadas fictícias de Moema, SP (Fallback)...", error);
          
          // Coordenadas simuladas de Moema, SP para testes em computadores sem GPS
          const latFicticia = -23.5992;
          const lonFicticia = -46.6624;
          
          statusTexto.innerText = "GPS inativo. Buscando ao redor de Moema, SP (Simulação)...";

          const urlOSM = `https://nominatim.openstreetmap.org/search?format=json&q=[${categoria}]&lat=${latFicticia}&lon=${lonFicticia}&viewbox=${VIEWBOX_SP}&bounded=1&addressdetails=1&limit=8&accept-language=pt-br`;

          fetch(urlOSM, {
            headers: {
              'User-Agent': 'SSVP-Web-App-Test-Laboratorio'
            }
          })
          .then(res => res.json())
          .then(data => {
            const resultadosFiltrados = data.filter(item => {
              const itemLat = parseFloat(item.lat);
              const itemLon = parseFloat(item.lon);
              const dist = calcularDistanciaLinear(latFicticia, lonFicticia, itemLat, itemLon);
              return (dist * 1000) <= raioMetros;
            });

            if (resultadosFiltrados.length === 0) {
              exibirErro(`Nenhum local encontrado em Moema dentro do raio de ${raioMetros/1000} km.`);
              return;
            }

            renderizarResultados(resultadosFiltrados, latFicticia, lonFicticia);
          })
          .catch(err => {
            console.error(err);
            exibirErro("Falha de conexão com o OpenStreetMap.");
          });
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // Renderizar lista de cards com endereços e distância
    function renderizarResultados(lista, latUsuario, lonUsuario) {
      const statusPainel = document.getElementById('statusPainel');
      const resultadosContainer = document.getElementById('resultadosContainer');
      
      statusPainel.style.display = 'none';
      resultadosContainer.innerHTML = '';

      lista.forEach(item => {
        // Extrai o nome amigável
        let nome = item.address.bakery || item.address.pharmacy || item.address.supermarket || item.address.hospital || item.address.amenity || item.address.shop || item.address.name || item.name || "Estabelecimento";
        
        // Se o nome for genérico demais, tenta usar a primeira palavra chave do display name
        if (nome === "Estabelecimento" && item.display_name) {
          nome = item.display_name.split(',')[0];
        }

        const enderecoCompleto = item.display_name;
        const latDestino = parseFloat(item.lat);
        const lonDestino = parseFloat(item.lon);

        // Calcula distância linear do usuário
        const distKm = calcularDistanciaLinear(latUsuario, lonUsuario, latDestino, lonDestino);
        const distanciaTexto = formatarDistanciaTexto(distKm);

        // Link de navegação para Google Maps externo
        const urlRota = `https://www.google.com/maps/dir/?api=1&origin=${latUsuario},${lonUsuario}&destination=${encodeURIComponent(enderecoCompleto)}`;

        const cardHtml = `
          <div class="card-resultado">
            <div class="card-resultado-header">
              <span class="card-resultado-title" title="${nome}">${nome}</span>
              <span class="badge-distancia">a ${distanciaTexto}</span>
            </div>
            <div class="card-resultado-body">
              <div class="address-info">
                📍 <strong>Endereço obtido:</strong><br>
                ${formatarEndereco(item.address, enderecoCompleto)}
              </div>
              <button class="btn-maps" onclick="window.open('${urlRota}', '_blank')">
                🗺️ Abrir Rota
              </button>
            </div>
          </div>
        `;
        resultadosContainer.innerHTML += cardHtml;
      });
    }

    // Formatar endereço JSON do Nominatim de forma limpa
    function formatarEndereco(address, displayName) {
      if (!address) return displayName;
      
      const rua = address.road || "";
      const numero = address.house_number || "S/N";
      const bairro = address.suburb || address.neighbourhood || "";
      const cidade = address.city || address.town || "";
      
      if (rua) {
        return `${rua}, ${numero}${bairro ? ' - ' + bairro : ''}${cidade ? ' - ' + cidade : ''}`;
      }
      return displayName.split(',').slice(0, 3).join(',');
    }

    // Calcular distância linear (Fórmula de Haversine)
    function calcularDistanciaLinear(lat1, lon1, lat2, lon2) {
      const R = 6371; // Raio da Terra em km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; // Retorna em km
    }

    // Formata o valor numérico da distância em texto legível
    function formatarDistanciaTexto(distanciaKm) {
      if (distanciaKm < 1) {
        return `${Math.round(distanciaKm * 1000)}m`;
      }
      return `${distanciaKm.toFixed(1)} km`;
    }

    // Exibir painel de erro
    function exibirErro(msg) {
      const statusSpinner = document.getElementById('statusSpinner');
      const statusTexto = document.getElementById('statusTexto');
      
      statusSpinner.style.display = 'none';
      statusTexto.innerHTML = `<span style="color: var(--ssvp-red); font-weight: 600;">⚠️</span> ${msg}`;
    }
  </script>
</body>
</html>
