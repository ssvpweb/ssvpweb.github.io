<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Testes SSVP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      padding: 6px;
      color: #333333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      background-color: #003366;
      color: white;
      padding: 16px;
      border-radius: 4px 4px 0 0;
      text-align: center;
    }

    .header h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .header p {
      font-size: 0.8rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .test-list {
      background-color: white;
      border: 1px solid #dcdfe3;
      border-top: none;
      border-radius: 0 0 4px 4px;
    }

    .test-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 12px;
      border-bottom: 1px solid #eef2f5;
      text-decoration: none;
      color: #003366;
      font-weight: 700;
      font-size: 0.95rem;
      -webkit-tap-highlight-color: transparent;
    }

    .test-item:last-child {
      border-bottom: none;
    }

    .loading {
      padding: 20px;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    .breadcrumb {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 8px;
      padding: 0 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Laboratório de Testes SSVP</h1>
      <p>Cada [pasta] contêm um arquivo LEIA_ME.html que explica os testes da pasta</p>
      <p>Selecione um arquivo abaixo</p>
    </div>

    <div class="test-list" id="file-list">
      <div class="loading">Carregando arquivos de teste...</div>
    </div>
  </div>

  <script>
    const user = 'webappssvp';
    const repo = 'webappssvp.github.io';
    const baseFolder = 'testes';

    async function loadTestFiles() {
      const listContainer = document.getElementById('file-list');

      try {
        // Busca o conteúdo da pasta de testes
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${baseFolder}`);
        if (!response.ok) throw new Error('Falha ao listar o diretório');

        const items = await response.json();
        listContainer.innerHTML = '';

        // Filtra para remover o próprio index.html
        const validItems = items.filter(item => item.name !== 'index.html');

        if (validItems.length === 0) {
          listContainer.innerHTML = '<div class="loading">Nenhum teste encontrado.</div>';
          return;
        }

        for (const item of validItems) {
          if (item.type === 'dir') {
            // Se for uma subpasta, busca os arquivos .html dentro dela
            const subRes = await fetch(item.url);
            if (subRes.ok) {
              const subItems = await subRes.json();
              const htmlFiles = subItems.filter(f => f.name.endsWith('.html') && f.name !== 'index.html');

              htmlFiles.forEach(file => {
                const a = document.createElement('a');
                a.className = 'test-item';
                // Aponta diretamente para o arquivo dentro da subpasta (ex: testes/voz/teste01.html)
                a.href = `./${item.name}/${file.name}`;
                a.innerHTML = `<span>📄 <strong>[${item.name}]</strong> ${file.name}</span> <span>➔</span>`;
                listContainer.appendChild(a);
              });
            }
          } else if (item.name.endsWith('.html')) {
            // Se for um arquivo HTML direto na raiz da pasta testes
            const a = document.createElement('a');
            a.className = 'test-item';
            a.href = `./${item.name}`;
            a.innerHTML = `<span>📄 ${item.name}</span> <span>➔</span>`;
            listContainer.appendChild(a);
          }
        }

      } catch (error) {
        listContainer.innerHTML = `<div class="loading" style="color:red;">Erro ao carregar lista de testes.</div>`;
      }
    }

    loadTestFiles();
  </script>

</body>
</html>
