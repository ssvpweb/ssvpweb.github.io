<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Laboratório de Testes SSVP</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      padding: calc(1rem + env(safe-area-inset-top)) calc(0.5rem + env(safe-area-inset-right)) calc(1rem + env(safe-area-inset-bottom)) calc(0.5rem + env(safe-area-inset-left));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Cabeçalho */
    .header {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      color: white;
      padding: 1.5rem 1.25rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 8px 24px rgba(30, 58, 138, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.85rem;
      opacity: 0.85;
      line-height: 1.4;
    }

    .status-banner {
      display: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      margin-top: 10px;
      background-color: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
    }

    /* Campo de Busca & Filtros */
    .search-filter-area {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: #131a2c;
      color: #f3f4f6;
      font-size: 16px; /* Previne zoom no Safari do iOS */
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: #3b82f6;
      background-color: #17223b;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Categorias / Tags */
    .categories-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none; /* Firefox */
    }

    .categories-tabs::-webkit-scrollbar {
      display: none; /* Safari e Chrome */
    }

    .tab-btn {
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background-color: #131a2c;
      color: #9ca3af;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background-color: rgba(255, 255, 255, 0.04);
      color: #f3f4f6;
    }

    .tab-btn.active {
      background-color: #3b82f6;
      color: white;
      border-color: #3b82f6;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);
    }

    /* Cartões de Pasta (Folder Cards) */
    .folder-card {
      background-color: #131a2c;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .folder-card:hover {
      border-color: #3b82f6;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.15);
    }

    /* Cabeçalho do Cartão */
    .folder-header {
      padding: 1.1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background-color: rgba(255, 255, 255, 0.01);
      transition: background-color 0.2s ease;
    }

    .folder-header:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .folder-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .folder-icon {
      font-size: 1.4rem;
      display: inline-block;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .folder-name {
      font-weight: 600;
      font-size: 0.98rem;
      color: #f3f4f6;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .folder-count-badge {
      background-color: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(59, 130, 246, 0.2);
      flex-shrink: 0;
    }

    .folder-chevron {
      font-size: 1.3rem;
      font-weight: 700;
      color: #9ca3af;
      display: inline-block;
      line-height: 1;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* Estado Ativo/Expandido */
    .folder-card.active {
      border-color: #3b82f6;
    }

    .folder-card.active .folder-chevron {
      color: #3b82f6;
    }

    /* Conteúdo Expandido do Cartão */
    .folder-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      background-color: rgba(0, 0, 0, 0.15);
    }

    .files-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* Links de Arquivos */
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.25rem 0.9rem 2.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      text-decoration: none;
      color: #9ca3af;
      font-weight: 500;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-item:hover {
      background-color: rgba(59, 130, 246, 0.05);
      color: #3b82f6;
      padding-left: 2.75rem;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-arrow {
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.2s ease;
      color: #3b82f6;
      font-weight: bold;
    }

    .file-item:hover .file-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .loading-state {
      padding: 40px;
      text-align: center;
      color: #9ca3af;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(59, 130, 246, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Laboratório de Testes SSVP</h1>
      <p style="margin-top: 4px; font-size: 0.8rem; opacity: 0.8;">Os dados usados são fictícios e destinados apenas a fins de teste.</p>
      <div id="status-banner" class="status-banner"></div>
    </div>

    <!-- Barra de Busca & Filtros -->
    <div class="search-filter-area">
      <div class="search-input-wrapper">
        <input type="text" id="search-box" class="search-input" placeholder="Pesquisar arquivos de teste..." oninput="handleFilterChange()">
      </div>
      <div id="categories-tabs-container" class="categories-tabs">
        <!-- Injetado dinamicamente -->
      </div>
    </div>

    <!-- Div principal onde os cartões de pastas serão injetados -->
    <div id="folders-container" class="flex-column" style="gap: 12px; display: flex; flex-direction: column;">
      <div class="loading-state">
        <div class="spinner"></div>
        <span>Carregando diretórios de teste...</span>
      </div>
    </div>
  </div>

  <script>
    // Configurações do repositório
    const user = 'ssvpweb';
    const repo = 'ssvpweb.github.io';
    const baseFolder = 'testes';

    // Banco de Dados Local Estático de Redundância (fallback completo e sincronizado)
    const fallbackTestes = [
      {
        folder: "google_login",
        files: [
          { name: "v1_google_login_autenticacao.html" }
        ]
      },
      {
        folder: "google_maps",
        files: [
          { name: "v1_lista_botoes.html" },
          { name: "v2_mapa_local.html" },
          { name: "v3_mapa_leaflet_geral.html" },
          { name: "v4_dropdown_selecao_enderecos.html" },
          { name: "v4.1_voz_comandos_mapa.html" },
          { name: "v4.2_voz_feedback_mapa.html" },
          { name: "v5_simulador_visita_basico.html" },
          { name: "v5.1_simulador_visita_voz_referencias.html" }
        ]
      },
      {
        folder: "google_sheets",
        files: [
          { name: "LEIA_ME.html" },
          { name: "v1_sheets_crud_pessoas.html" }
        ]
      },
      {
        folder: "login",
        files: [
          { name: "v1_pin.html" },
          { name: "v2_senha.html" }
        ]
      },
      {
        folder: "open_street_maps",
        files: [
          { name: "v1_osm_busca_raio.html" }
        ]
      },
      {
        folder: "pastoral_de_rua",
        files: [
          { name: "relato.html" }
        ]
      },
      {
        folder: "pwa",
        files: [
          { name: "index.html" }
        ]
      },
      {
        folder: "sem_internet",
        files: [
          { name: "LEIA_ME.html" }
        ]
      },
      {
        folder: "simuladores",
        files: [
          { name: "v1_sincronizador_visitas_local_nuvem.html" },
          { name: "v2_sincronizador_visitas_local_nuvem.html" }
        ]
      },
      {
        folder: "sincronizacao",
        files: [
          { name: "v1_sinc_fila_offline.html" }
        ]
      },
      {
        folder: "spa",
        files: [
          { name: "index.html" },
          { name: "v1_login_spa.html" }
        ]
      },
      {
        folder: "ux",
        files: [
          { name: "index.html" },
          { name: "login.html" }
        ]
      },
      {
        folder: "ux / barra_inferior",
        files: [
          { name: "index.html" }
        ]
      },
      {
        folder: "ux / cards_expand",
        files: [
          { name: "index.html" }
        ]
      },
      {
        folder: "ux / cards_slide",
        files: [
          { name: "index.html" }
        ]
      },
      {
        folder: "ux / voz_com_toque",
        files: [
          { name: "index.html" }
        ]
      },
      {
        folder: "voz",
        files: [
          { name: "LEIA_ME.html" },
          { name: "v1_gravacao_audio_simples.html" },
          { name: "v2_comandos_de_voz.html" }
        ]
      }
    ];

    // Variáveis globais para armazenar os dados processados e filtros ativos
    let allProcessedFolders = [];
    let activeCategory = 'all';

    async function loadTestFiles() {
      const container = document.getElementById('folders-container');
      const banner = document.getElementById('status-banner');

      try {
        // Consulta recursiva na árvore de commits (Git Trees API)
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/git/trees/main?recursive=true`);
        if (!response.ok) throw new Error('Limite da API do GitHub atingido ou offline');

        const data = await response.json();
        
        // Filtra caminhos que estão dentro de "testes/", terminam com ".html" e não são "index.html" na raiz
        const testsPrefix = `${baseFolder}/`;
        const testFiles = data.tree.filter(item => {
          return item.type === 'blob' &&
                 item.path.startsWith(testsPrefix) &&
                 item.path.endsWith('.html') &&
                 !(item.path === `${testsPrefix}index.html`) &&
                 item.path.substring(testsPrefix.length).includes('/');
        });

        if (testFiles.length === 0) {
          container.innerHTML = '<div class="loading-state">Nenhum arquivo de teste encontrado.</div>';
          return;
        }

        // Agrupa os arquivos por pasta
        const foldersMap = {};

        testFiles.forEach(file => {
          const relativePath = file.path.substring(testsPrefix.length);
          const pathParts = relativePath.split('/');
          const fileName = pathParts.pop(); // Remove arquivo
          
          const rawFolderName = pathParts.join('/');
          const displayFolderName = pathParts.join(' / ');
          const firstLevelDir = pathParts[0] || 'geral';

          if (!foldersMap[rawFolderName]) {
            foldersMap[rawFolderName] = {
              displayName: displayFolderName,
              folderPath: rawFolderName,
              category: firstLevelDir,
              files: []
            };
          }

          foldersMap[rawFolderName].files.push({
            name: fileName,
            link: `./${rawFolderName}/${fileName}`
          });
        });

        // Ordena e mapeia
        const sortedFolders = Object.values(foldersMap).sort((a, b) => {
          return a.folderPath.localeCompare(b.folderPath);
        });

        allProcessedFolders = sortedFolders.map(folderObj => {
          folderObj.files.sort((a, b) => a.name.localeCompare(b.name));
          return {
            folder: folderObj.displayName,
            rawFolder: folderObj.folderPath,
            category: folderObj.category,
            files: folderObj.files
          };
        });

        renderInterface();

      } catch (error) {
        console.warn("GitHub API indisponível, usando fallback estático local: ", error);
        
        if (banner) {
          banner.innerText = "Modo de Desenvolvimento Local (API Offline/Limitada)";
          banner.style.display = "block";
        }

        // Mapeia o fallback para o mesmo formato
        allProcessedFolders = fallbackTestes.map(item => {
          const pathParts = item.folder.split(' / ');
          const firstLevelDir = pathParts[0] || 'geral';
          return {
            folder: item.folder,
            rawFolder: item.folder.replace(/ \/ /g, '/'),
            category: firstLevelDir,
            files: item.files.map(f => {
              const localPath = item.folder.replace(/ \/ /g, '/');
              return {
                name: f.name,
                link: `./${localPath}/${f.name}`
              };
            })
          };
        });

        renderInterface();
      }
    }

    // Inicializa a interface de filtros e renderização dos cartões
    function renderInterface() {
      renderCategoryTabs();
      applyFilters();
    }

    // Cria as abas de categoria dinamicamente
    function renderCategoryTabs() {
      const tabsContainer = document.getElementById('categories-tabs-container');
      if (!tabsContainer) return;

      // Obtém categorias exclusivas
      const categories = ['all', ...new Set(allProcessedFolders.map(item => item.category))];
      
      // Formatação amigável para exibição das abas
      const categoryLabels = {
        'all': 'Todos',
        'ux': 'Interface (UX/UI)',
        'login': 'Acesso/Login',
        'voz': 'Reconhecimento Voz',
        'spa': 'Navegação SPA',
        'simuladores': 'Simuladores',
        'sincronizacao': 'Sincronização',
        'pwa': 'PWA/Mobile',
        'pastoral_de_rua': 'Pastoral de Rua',
        'sem_internet': 'Modo Offline',
        'google_maps': 'Google Maps',
        'google_login': 'Google Login',
        'google_sheets': 'Google Sheets',
        'open_street_maps': 'OpenStreetMap'
      };

      tabsContainer.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${activeCategory === cat ? 'active' : ''}`;
        btn.textContent = categoryLabels[cat] || cat.replace(/_/g, ' ');
        btn.onclick = () => selectCategory(cat, btn);
        tabsContainer.appendChild(btn);
      });
    }

    function selectCategory(cat, btnElement) {
      activeCategory = cat;
      // Atualiza estado visual do botão
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      
      applyFilters();
    }

    function handleFilterChange() {
      applyFilters();
    }

    // Aplica o filtro de busca e a aba de categoria selecionada
    function applyFilters() {
      const searchBox = document.getElementById('search-box');
      const searchTerm = searchBox ? searchBox.value.toLowerCase().trim() : '';

      const filtered = allProcessedFolders.map(folderObj => {
        // Verifica se a pasta pertence à categoria ativa (se não for 'all')
        const matchesCategory = activeCategory === 'all' || folderObj.category === activeCategory;
        if (!matchesCategory) return null;

        // Se houver busca, filtra os arquivos correspondentes
        const folderMatchesSearch = folderObj.folder.toLowerCase().includes(searchTerm);
        
        const matchingFiles = folderObj.files.filter(file => {
          return file.name.toLowerCase().includes(searchTerm) || folderMatchesSearch;
        });

        if (matchingFiles.length > 0) {
          return {
            folder: folderObj.folder,
            rawFolder: folderObj.rawFolder,
            files: matchingFiles
          };
        }
        return null;
      }).filter(item => item !== null);

      renderFolders(filtered);
    }

    // Renderiza os cartões filtrados na tela
    function renderFolders(foldersList) {
      const container = document.getElementById('folders-container');
      container.innerHTML = '';

      if (foldersList.length === 0) {
        container.innerHTML = '<div class="loading-state">Nenhum arquivo ou pasta de teste corresponde aos filtros.</div>';
        return;
      }

      foldersList.forEach((folderObj, index) => {
        const card = document.createElement('div');
        card.className = 'folder-card';
        card.id = `folder-card-${index}`;

        let filesHtml = '';
        folderObj.files.forEach(file => {
          filesHtml += `
            <a href="${file.link}" class="file-item">
              <div class="file-info">
                <span>📄</span>
                <span>${file.name}</span>
              </div>
              <span class="file-arrow">➔</span>
            </a>
          `;
        });

        card.innerHTML = `
          <div class="folder-header" onclick="toggleFolder(${index})">
            <div class="folder-title-area">
              <span class="folder-icon" id="folder-icon-${index}">📁</span>
              <span class="folder-name">${folderObj.folder}</span>
              <span class="folder-count-badge">${folderObj.files.length}</span>
            </div>
            <span class="folder-chevron" id="folder-chevron-${index}">+</span>
          </div>
          <div class="folder-content" id="folder-content-${index}">
            <div class="files-list">
              ${filesHtml}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Controle de expansão
    function toggleFolder(index) {
      const card = document.getElementById(`folder-card-${index}`);
      const content = document.getElementById(`folder-content-${index}`);
      const icon = document.getElementById(`folder-icon-${index}`);
      const chevron = document.getElementById(`folder-chevron-${index}`);

      if (!card || !content) return;

      const isExpanded = card.classList.contains('active');

      // Colapsa os outros (efeito acordeon)
      const allCards = document.querySelectorAll('.folder-card');
      allCards.forEach((c, idx) => {
        if (idx !== index) {
          c.classList.remove('active');
          const otherContent = document.getElementById(`folder-content-${idx}`);
          const otherIcon = document.getElementById(`folder-icon-${idx}`);
          const otherChevron = document.getElementById(`folder-chevron-${idx}`);
          if (otherContent) otherContent.style.maxHeight = '0px';
          if (otherIcon) otherIcon.innerText = '📁';
          if (otherChevron) otherChevron.innerText = '+';
        }
      });

      if (isExpanded) {
        card.classList.remove('active');
        content.style.maxHeight = '0px';
        if (icon) icon.innerText = '📁';
        if (chevron) chevron.innerText = '+';
      } else {
        card.classList.add('active');
        content.style.maxHeight = content.scrollHeight + 'px';
        if (icon) icon.innerText = '📂';
        if (chevron) chevron.innerText = '−';
      }
    }

    loadTestFiles();
  </script>

</body>
</html>
