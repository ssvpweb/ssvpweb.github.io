<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visita Vicentina - Google Maps</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      padding: 4px;
      color: #333333;
    }

    .card-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background-color: #ffffff;
      border-radius: 4px;
      border: 1px solid #dcdfe3;
      overflow: hidden;
    }

    .card-header {
      background-color: #003366;
      color: #ffffff;
      padding: 12px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .card-subtitle {
      font-size: 0.8rem;
      opacity: 0.9;
      margin-top: 2px;
    }

    .card-body {
      padding: 12px 10px;
      background-color: #ffffff;
    }

    .address-info {
      font-size: 0.9rem;
      color: #444444;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    /* BOTÃO PARA ABRIR A ROTA NO GOOGLE MAPS */
    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background-color: #27ae60; /* Verde destacado para ação de navegação */
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-maps:active {
      background-color: #219653;
    }
  </style>
</head>
<body>

  <div class="card-container">

    <!-- CARD DO ASSISTIDO -->
    <div class="card">
      <div class="card-header">
        <div>
          <div class="card-title">Família Santos</div>
          <div class="card-subtitle">Assistido: João da Silva</div>
        </div>
      </div>
      
      <div class="card-body">
        <div class="address-info">
          📍 <strong>Endereço:</strong><br>
          Rua das Flores, 123 - Centro, São Paulo - SP
        </div>

        <!-- BOTÃO DE ROTA QUE ABRE O GOOGLE MAPS NO CELULAR -->
        <button class="btn-maps" onclick="abrirRotaMaps('Rua das Flores, 123, Centro, São Paulo, SP')">
          🗺️ Abrir Rota no Google Maps
        </button>
      </div>
    </div>

  </div>

  <script>
    function abrirRotaMaps(enderecoCompleto) {
      // Converte o endereço em formato seguro para URL
      const enderecoFormatado = encodeURIComponent(enderecoCompleto);
      
      // Monta a URL de direção a partir da localização atual do usuário
      const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${enderecoFormatado}`;

      // Abre a URL em uma nova aba (ou diretamente no app do Google Maps no celular)
      window.open(mapsUrl, '_blank');
    }
  </script>

</body>
</html>
