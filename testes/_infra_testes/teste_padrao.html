<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de Teste Padrão - SSVP</title>
  
  <!-- Estilos Padrão SSVP -->
  <link rel="stylesheet" href="teste_padrao.css">
  
  <!-- Fonte Inter para tipografia premium -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Estilos Locais de Demonstração */
    .quadrado-teste {
      width: 150px;
      height: 150px;
      margin: 2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      border-radius: var(--demo-border-radius, 8px);
      background-color: var(--demo-bg-color, #007fff);
      color: white;
      font-size: var(--demo-font-size, 16px);
      transition: all 0.2s ease;
    }
  </style>
</head>
<body>

  <!-- Área dedicada para o Teste Específico -->
  <main class="teste-container">
    <div class="quadrado-teste" id="quadradoDemo">
      Calibre no Painel!
    </div>
    
    <div class="teste-placeholder" id="areaTeste">
      <span>[Área reservada para a funcionalidade do teste]</span>
    </div>
  </main>

  <!-- Script do Motor do Sandbox -->
  <script src="sandbox.js"></script>
  <script>
    // Inicializa a sandbox com controles de demonstração
    inicializarSandbox({
      id_teste: "modelo_padrao_demo",
      titulo: "Modelo de Teste",
      versao: "teste v1.0",
      instrucoes: [
        "Use o painel acima para configurar os valores visuais do quadrado de teste.",
        "Veja a alteração ocorrer em tempo real no elemento central da tela.",
        "Ao encontrar a calibração ideal, clique em 'Copiar Ajustes' para salvar e colar no chat."
      ],
      controles: [
        { variavel: "--demo-border-radius", label: "Arredondamento Borda", tipo: "range", min: 0, max: 75, padrao: 8, unit: "px" },
        { variavel: "--demo-font-size", label: "Tamanho da Fonte", tipo: "range", min: 12, max: 28, padrao: 16, unit: "px" },
        { variavel: "--demo-bg-color", label: "Cor do Quadrado", tipo: "color", padrao: "#007fff" }
      ]
    });
  </script>
</body>
</html>
